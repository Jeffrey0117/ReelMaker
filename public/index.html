<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReelMaker</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root {
  --bg: #121212;
  --surface: #1e1e1e;
  --surface-alt: #2a2a2a;
  --text: #ececec;
  --text-muted: #888;
  --accent: #ff6b4a;
  --accent-hover: #ff8a6a;
  --border: #333;
  --radius: 10px;
  --mm-bg: #0d0d0d;
  --mm-text: #ffffff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.toolbar h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  margin-right: 8px;
}

.toolbar select,
.toolbar button,
.toolbar input[type="text"] {
  padding: 6px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}

.toolbar select:hover,
.toolbar button:hover,
.toolbar input[type="text"]:focus {
  border-color: var(--accent);
}

.toolbar button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

.toolbar button.primary:hover {
  background: var(--accent-hover);
}

.toolbar button.danger {
  background: transparent;
  border-color: #ff6b4a;
  color: #ff6b4a;
}

.toolbar button.danger:hover {
  background: #ff6b4a20;
}

.toolbar .spacer { flex: 1; }

/* Main content */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.editor-pane {
  width: 40%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
}

.editor-pane textarea {
  flex: 1;
  padding: 16px;
  background: var(--surface);
  color: var(--text);
  border: none;
  resize: none;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 14px;
  line-height: 1.6;
  outline: none;
  tab-size: 2;
}

.editor-pane textarea::placeholder {
  color: var(--text-muted);
}

.preview-pane {
  flex: 1;
  position: relative;
  background: var(--mm-bg);
  padding: 8px;
}

.preview-pane svg {
  width: 100%;
  height: 100%;
}

/* Bottom bar */
.bottom-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 16px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.bottom-bar label {
  font-size: 13px;
  color: var(--text-muted);
}

.bottom-bar .source-group {
  display: flex;
  gap: 12px;
  align-items: center;
}

.bottom-bar .source-group label {
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  color: var(--text);
}

.bottom-bar input[type="radio"] {
  accent-color: var(--accent);
}

.bottom-bar input[type="color"] {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  background: transparent;
  padding: 0;
}

.bottom-bar input[type="file"] {
  display: none;
}

.bottom-bar .file-label {
  padding: 4px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
}

.bottom-bar .file-label:hover {
  border-color: var(--accent);
}

/* Video controls */
.video-controls {
  display: none;
  align-items: center;
  gap: 8px;
}

.video-controls button {
  padding: 4px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  line-height: 1;
}

.video-controls button:hover {
  border-color: var(--accent);
}

.video-controls input[type="range"] {
  width: 70px;
  height: 4px;
  accent-color: var(--accent);
  cursor: pointer;
}

.video-controls .vc-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  min-width: 36px;
}

/* Editor pane tabs */
.editor-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.editor-tab {
  padding: 8px 20px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}

.editor-tab:hover {
  color: var(--text);
}

.editor-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.editor-preview {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  background: var(--surface);
  display: flex;
  flex-direction: column;
}

.editor-preview .ep-slide-preview {
  flex: 1;
  min-height: 0;
}

.ep-video-wrap {
  margin-bottom: 16px;
  border-radius: var(--radius);
  overflow: hidden;
  background: #000;
  flex-shrink: 0;
}

.ep-video-wrap video {
  width: 100%;
  display: block;
}

/* Storyboard slide preview (PPT normal view) */
.ep-slide-preview {
  display: none;
  position: relative;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 12px;
  padding: 12px;
}

.ep-slide-preview.visible {
  display: flex;
  align-items: center;
  justify-content: center;
}

.ep-slide-preview img {
  max-width: 100%;
  max-height: 40vh;
  object-fit: contain;
  border-radius: 6px;
  animation: slideIn 0.3s ease;
  transform-origin: center center;
  transition: transform 0.15s ease;
}

.ep-slide-preview .ep-nav {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
}

.ep-slide-preview .ep-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--text-muted) 40%, transparent);
  cursor: pointer;
  transition: background 0.2s, width 0.2s, border-radius 0.2s;
}

.ep-slide-preview .ep-dot.active {
  background: var(--accent);
  width: 16px;
  border-radius: 4px;
}

.ep-slide-preview .ep-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.45);
  color: #fff;
  border: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}

.ep-slide-preview:hover .ep-arrow {
  opacity: 1;
}

.ep-slide-preview .ep-arrow.left { left: 6px; }
.ep-slide-preview .ep-arrow.right { right: 6px; }

.ep-slide-label {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
  flex-shrink: 0;
}

.ep-storyboard {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  flex-wrap: nowrap;
  padding: 4px 0;
  flex-shrink: 0;
  margin-top: auto;
}

.ep-storyboard img {
  width: 60px;
  height: 60px;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: 6px;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: border-color 0.15s;
}

.ep-storyboard img:hover {
  border-color: var(--accent);
}

.ep-storyboard img.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.ep-empty {
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
  padding: 40px 0;
}

/* Recording mode */
body.recording .toolbar,
body.recording .editor-pane,
body.recording .bottom-bar {
  display: none !important;
}

body.recording .main {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #000;
}

/* Content constrained to center 9:16 column — this is the recorded area */
body.recording .preview-pane {
  width: calc(100vh * 9 / 16);
  height: var(--split-top, 50%);
  border: none;
  flex-shrink: 0;
}

body.recording .bg-layer {
  display: flex;
  width: calc(100vh * 9 / 16);
  height: var(--split-bottom, 50%);
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}

/* --- Controls in LEFT margin (visible, not recorded) --- */
.rec-controls {
  display: none;
  position: fixed;
  top: 50%;
  left: 24px;
  transform: translateY(-50%);
  z-index: 9999;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}

body.recording .rec-controls {
  display: flex;
}

.rec-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 3px solid #fff;
  background: rgba(30,30,30,0.8);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  transition: transform 0.15s;
}

.rec-btn:hover {
  transform: scale(1.1);
}

.rec-btn .dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ff6b4a;
  transition: all 0.2s;
}

.rec-btn.is-recording .dot {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  background: #fff;
}

.rec-timer {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: rgba(30,30,30,0.8);
  backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 20px;
  font-variant-numeric: tabular-nums;
  display: none;
  white-space: nowrap;
}

.rec-timer.visible {
  display: block;
}

.rec-timer .live-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff6b4a;
  margin-right: 6px;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.rec-exit {
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  position: fixed;
  bottom: 16px;
  left: 24px;
  z-index: 9999;
  display: none;
}

body.recording .rec-exit {
  display: block;
}

/* --- Teleprompter in RIGHT margin (visible, not recorded) --- */
.teleprompter {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  width: calc((100vw - 100vh * 9 / 16) / 2 - 48px);
  max-width: 480px;
  min-width: 200px;
  max-height: 70vh;
}

body.recording .teleprompter {
  display: flex;
  flex-direction: column;
}

.teleprompter-header {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.5);
  padding: 6px 12px;
  letter-spacing: 0.5px;
}

.teleprompter textarea {
  flex: 1;
  min-height: 300px;
  background: rgba(30,30,30,0.85);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  color: #f0f0f0;
  font-size: 18px;
  line-height: 1.8;
  padding: 16px;
  resize: vertical;
  outline: none;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.teleprompter textarea::placeholder {
  color: rgba(255,255,255,0.25);
}

.teleprompter textarea:focus {
  border-color: rgba(255,255,255,0.25);
}

.teleprompter .font-controls {
  display: flex;
  gap: 6px;
  padding: 6px 0;
  justify-content: flex-end;
}

.teleprompter .font-controls button {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.teleprompter .font-controls button:hover {
  background: rgba(255,255,255,0.2);
}

/* Background layer (hidden in edit mode) */
.bg-layer {
  display: none;
}

.bg-layer video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.bg-layer .slides-bg {
  width: 100%; height: 100%;
  display: none;
  position: relative;
}
.bg-layer .slides-bg img {
  width: 100%; height: 100%;
  object-fit: contain;
  position: absolute; inset: 0;
}
.bg-layer .slides-bg .slides-nav {
  position: absolute;
  bottom: 8px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 5px; z-index: 2;
}
.bg-layer .slides-bg .slides-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  cursor: pointer;
  transition: background 0.2s, width 0.2s, border-radius 0.2s;
}
.bg-layer .slides-bg .slides-dot.active {
  background: var(--accent);
  width: 16px; border-radius: 4px;
}

.bg-layer #bg3d {
  width: 100%;
  height: 100%;
  display: none;
}

.bg-layer #bg3dVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}


/* 3D scene selector */
.scene-select {
  display: none;
  margin-left: 8px;
  padding: 4px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  outline: none;
}

.scene-select:hover {
  border-color: var(--accent);
}

/* Split ratio dropdown */
.split-select {
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(30,30,30,0.8);
  backdrop-filter: blur(8px);
  color: #fff;
  font-size: 11px;
  cursor: pointer;
  outline: none;
}

.swap-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(30,30,30,0.8);
  backdrop-filter: blur(8px);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s, transform 0.15s;
}
.swap-btn:hover {
  border-color: var(--accent);
  transform: scale(1.1);
}
body.recording.swapped .preview-pane { order: 2; }
body.recording.swapped .bg-layer { order: 1; }

.rec-bg-select select {
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(30,30,30,0.8);
  backdrop-filter: blur(8px);
  color: #fff;
  font-size: 11px;
  cursor: pointer;
  outline: none;
}

.rec-audio-controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 6px 0;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.rec-audio-label {
  font-size: 14px;
  color: rgba(255,255,255,0.6);
}
.rec-audio-controls select {
  width: 100%;
  max-width: 120px;
  padding: 3px 4px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(30,30,30,0.8);
  color: #fff;
  font-size: 10px;
  cursor: pointer;
  outline: none;
}
.rec-audio-controls input[type="range"] {
  width: 100%;
  max-width: 120px;
  height: 4px;
  accent-color: var(--accent);
  cursor: pointer;
}

/* Markmap styling */
.preview-pane svg#markmap {
  background: var(--mm-bg);
  border-radius: 8px;
  cursor: pointer;
}

/* Prevent accidental text selection on mindmap */
.preview-pane svg#markmap,
.preview-pane svg#markmap * {
  user-select: none !important;
  -webkit-user-select: none !important;
}

/* Custom cursor for interactive nodes */
svg#markmap .markmap-node {
  cursor: pointer;
}

svg#markmap .markmap-node:hover foreignObject * {
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--mm-text) 30%, transparent);
  text-underline-offset: 3px;
}

/* Force text color on foreignObject HTML nodes */
svg#markmap foreignObject div,
svg#markmap foreignObject span,
svg#markmap foreignObject p,
svg#markmap foreignObject * {
  color: var(--mm-text) !important;
  font-weight: 600 !important;
  font-size: 15px !important;
}

/* SVG text fallback */
svg#markmap text {
  fill: var(--mm-text) !important;
}

/* Recording mode */
body.recording .preview-pane svg#markmap {
  background: var(--mm-bg);
  border-radius: 0;
}

/* --- Slide renderer --- */
.slide-container {
  display: none;
  position: absolute;
  inset: 0;
  background: var(--mm-bg);
  overflow: hidden;
}

.slide-container.visible {
  display: flex;
  align-items: center;
  justify-content: center;
}

.slide-card {
  width: 85%;
  max-height: 90%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  animation: slideIn 0.4s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.slide-card .slide-img {
  max-width: 100%;
  max-height: 45%;
  border-radius: 12px;
  object-fit: contain;
}

.slide-card .slide-title {
  font-size: 28px;
  font-weight: 800;
  color: var(--mm-text);
  text-align: center;
}

.slide-card .slide-items {
  list-style: none;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.slide-card .slide-items li {
  font-size: 18px;
  color: var(--mm-text);
  font-weight: 500;
  opacity: 0.85;
}

.slide-nav {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 20;
}

.slide-nav .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--mm-text) 25%, transparent);
  transition: background 0.2s;
}

.slide-nav .dot.active {
  background: var(--accent);
  width: 20px;
  border-radius: 4px;
}

/* Layout mode */
body.layout .toolbar { flex-shrink: 0; }
body.layout .editor-pane { display: none !important; }
body.layout .bottom-bar { display: none !important; }

body.layout .main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

body.layout .preview-pane {
  width: calc(100vh * 9 / 16 * 0.9);
  height: 90vh;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

/* --- Whiteboard overlay (canvas + images) --- */
.wb-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.wb-layer.active {
  pointer-events: auto;
  cursor: crosshair;
}

.wb-layer canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* Draggable images on whiteboard */
.wb-img {
  position: absolute;
  cursor: grab;
  border: 2px solid transparent;
  border-radius: 6px;
  transition: border-color 0.15s, box-shadow 0.15s;
  max-width: 45%;
  max-height: 40%;
  object-fit: contain;
  z-index: 11;
}

.wb-img:hover {
  border-color: rgba(255,255,255,0.4);
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
}

.wb-img.dragging {
  cursor: grabbing;
  border-color: var(--accent);
  opacity: 0.9;
}

/* Drawing toolbar — left sidebar in recording mode */
.draw-tools {
  display: none;
  position: fixed;
  left: 24px;
  bottom: 50px;
  z-index: 9999;
  flex-direction: column;
  gap: 6px;
  align-items: center;
}

body.recording .draw-tools,
body.layout .draw-tools {
  display: flex;
}

.draw-tools button {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(30,30,30,0.8);
  backdrop-filter: blur(8px);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.15s, background 0.15s;
  padding: 0;
  line-height: 1;
}

.draw-tools button:hover {
  border-color: rgba(255,255,255,0.4);
}

.draw-tools button.active {
  border-color: var(--accent);
  background: rgba(255,107,74,0.25);
}

.draw-tools .color-dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.3);
  cursor: pointer;
}

.draw-tools input[type="color"] {
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 0;
  border-radius: 50%;
}

.draw-tools .sep {
  width: 28px;
  height: 1px;
  background: rgba(255,255,255,0.1);
  margin: 2px 0;
}

/* Edit mode toolbar (non-recording) */
.edit-draw-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}

.edit-draw-tools button {
  padding: 4px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
}

.edit-draw-tools button:hover {
  border-color: var(--accent);
}

.edit-draw-tools button.active {
  border-color: var(--accent);
  background: rgba(255,107,74,0.15);
}

/* --- Storyboard Panel (recording mode, right side above teleprompter) --- */
.storyboard-panel {
  display: none;
  position: fixed;
  top: 16px;
  right: 24px;
  z-index: 9999;
  width: calc((100vw - 100vh * 9 / 16) / 2 - 48px);
  max-width: 360px;
  min-width: 160px;
}

body.recording .storyboard-panel {
  display: block;
}

.storyboard-panel-header {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.5);
  padding: 6px 12px;
  letter-spacing: 0.5px;
}

.storyboard-panel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
  gap: 6px;
  padding: 0 12px 8px;
}

.sb-thumb {
  position: relative;
  aspect-ratio: 9/16;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.1);
  transition: border-color 0.15s, transform 0.15s;
  background: rgba(30,30,30,0.6);
}

.sb-thumb:hover {
  border-color: var(--accent);
  transform: scale(1.05);
}
.sb-thumb.active-bg {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.sb-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.sb-thumb .sb-index {
  position: absolute;
  top: 2px;
  left: 4px;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.sb-thumb .sb-del {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 18px;
  height: 18px;
  font-size: 13px;
  line-height: 18px;
  text-align: center;
  color: #fff;
  background: rgba(220,40,40,0.7);
  border-radius: 50%;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 2;
}

.sb-thumb:hover .sb-del {
  opacity: 1;
}

/* Storyboard overlay — covers markmap area */
.storyboard-overlay {
  position: absolute;
  inset: 0;
  z-index: 15;
  display: none;
  background: var(--mm-bg);
  animation: sbFadeIn 0.25s ease;
  overflow: hidden;
}

.storyboard-overlay.visible {
  display: flex;
  align-items: center;
  justify-content: center;
}

.storyboard-overlay img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  user-select: none;
  animation: sbSlideIn 0.35s ease;
}

@keyframes sbSlideIn {
  from { opacity: 0; scale: 0.92; }
  to { opacity: 1; scale: 1; }
}

/* Storyboard slideshow navigation dots */
.sb-nav {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 20;
}

.sb-nav .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--mm-text) 25%, transparent);
  transition: background 0.2s, width 0.2s, border-radius 0.2s;
  cursor: pointer;
}

.sb-nav .dot.active {
  background: var(--accent);
  width: 20px;
  border-radius: 4px;
}

@keyframes sbFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* SFX Soundboard Panel */
.sfx-panel {
  display: block;
  position: fixed;
  right: 24px;
  z-index: 9998;
  width: calc((100vw - 100vh * 9 / 16) / 2 - 48px);
  max-width: 360px;
  min-width: 160px;
}

.sfx-panel-header {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.5);
  padding: 6px 12px;
  letter-spacing: 0.5px;
}

.sfx-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 0 12px 8px;
}

.sfx-btn {
  background: rgba(30,30,30,0.8);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  color: #f0f0f0;
  font-size: 11px;
  font-weight: 600;
  padding: 10px 4px;
  cursor: pointer;
  text-align: center;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
  user-select: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sfx-btn:hover {
  background: rgba(50,50,50,0.9);
  border-color: rgba(255,255,255,0.2);
}

.sfx-btn:active {
  transform: scale(0.95);
}

.sfx-btn.playing {
  background: rgba(255,107,74,0.3);
  border-color: var(--accent);
  color: #fff;
}

/* Bottom bar storyboard section */
.storyboard-bar {
  display: flex;
  align-items: center;
  gap: 6px;
}

.sb-add-btn {
  width: 28px;
  height: 28px;
  border-radius: var(--radius);
  border: 1px dashed var(--border);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s;
}

.sb-add-btn:hover {
  border-color: var(--accent);
}

.sb-bar-thumbs {
  display: flex;
  gap: 4px;
  max-width: 300px;
  overflow-x: auto;
}

.sb-bar-thumbs .sb-mini {
  width: 28px;
  height: 28px;
  border-radius: 4px;
  overflow: hidden;
  cursor: grab;
  border: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
}

.sb-bar-thumbs .sb-mini img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.sb-bar-thumbs .sb-mini .sb-mini-del {
  position: absolute;
  top: -3px;
  right: -3px;
  width: 14px;
  height: 14px;
  font-size: 10px;
  line-height: 14px;
  text-align: center;
  color: #fff;
  background: rgba(220,40,40,0.8);
  border-radius: 50%;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 2;
}

.sb-bar-thumbs .sb-mini:hover .sb-mini-del {
  opacity: 1;
}

/* Asset library picker modal */
.asset-picker-modal {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
}

.asset-picker-body {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 600px;
  max-width: 90vw;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.asset-picker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
}

.asset-picker-header button {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
}

.asset-picker-grid {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 8px;
}

.asset-picker-item {
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.15s;
}

.asset-picker-item:hover {
  border-color: var(--accent);
}

.asset-picker-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.asset-picker-empty {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--text-muted);
  padding: 40px 0;
}

/* ── Subtitle Editor Modal ── */
.sub-modal {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
}

.sub-modal-body {
  background: var(--surface);
  border-radius: var(--radius);
  max-width: 900px;
  width: 94%;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--border);
}

.sub-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.sub-modal-header h2 {
  font-size: 18px;
  color: var(--text);
  font-weight: 600;
}

.sub-modal-header .sub-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 22px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: background .15s;
}

.sub-modal-header .sub-close:hover {
  background: var(--surface-alt);
  color: var(--text);
}

.sub-modal-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.sub-initial-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 20px;
}

.sub-initial-actions button {
  padding: 10px 24px;
  border-radius: 20px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  transition: background .15s;
}

.sub-initial-actions .sub-btn-download {
  background: var(--surface-alt);
  color: var(--text);
  border: 1px solid var(--border);
}

.sub-initial-actions .sub-btn-download:hover {
  background: var(--border);
}

.sub-initial-actions .sub-btn-subtitle {
  background: var(--accent);
  color: #fff;
}

.sub-initial-actions .sub-btn-subtitle:hover {
  background: var(--accent-hover);
}

.sub-video-preview {
  width: 100%;
  max-height: 40vh;
  border-radius: 8px;
  background: #000;
  display: block;
  margin: 0 auto;
}

.sub-video-container {
  position: relative;
  display: inline-block;
  width: 100%;
  text-align: center;
}

.sub-video-container canvas {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  max-height: 40vh;
}

.sub-progress {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.sub-progress .sub-spinner {
  display: inline-block;
  width: 28px;
  height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: subSpin .8s linear infinite;
  margin-bottom: 12px;
}

@keyframes subSpin {
  to { transform: rotate(360deg); }
}

.sub-segments {
  max-height: 30vh;
  overflow-y: auto;
  margin-top: 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.sub-segment {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
}

.sub-segment:last-child {
  border-bottom: none;
}

.sub-segment:hover {
  background: var(--surface-alt);
}

.sub-segment.active {
  background: rgba(255,107,74,0.12);
  border-left: 3px solid var(--accent);
}

.sub-segment-time {
  font-size: 12px;
  color: var(--text-muted);
  font-family: monospace;
  white-space: nowrap;
  min-width: 90px;
}

.sub-segment-text {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  color: var(--text);
  font-size: 13px;
  resize: none;
  min-height: 28px;
  font-family: inherit;
}

.sub-segment-text:focus {
  outline: none;
  border-color: var(--accent);
}

.sub-segment-del {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 16px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  transition: color .15s;
}

.sub-segment-del:hover {
  color: #e55;
}

.sub-style-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  padding: 10px 14px;
  background: var(--surface-alt);
  border-radius: 8px;
  flex-wrap: wrap;
}

.sub-style-bar label {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 5px;
}

.sub-style-bar select,
.sub-style-bar input[type="color"] {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 12px;
}

.sub-style-bar input[type="color"] {
  width: 30px;
  height: 26px;
  padding: 1px;
  cursor: pointer;
}

.sub-style-bar input[type="checkbox"] {
  accent-color: var(--accent);
}

.sub-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
}

.sub-actions button {
  padding: 8px 22px;
  border-radius: 20px;
  border: none;
  font-size: 13px;
  cursor: pointer;
  transition: background .15s;
}

.sub-actions .sub-btn-cancel {
  background: var(--surface-alt);
  color: var(--text);
  border: 1px solid var(--border);
}

.sub-actions .sub-btn-cancel:hover {
  background: var(--border);
}

.sub-actions .sub-btn-export {
  background: var(--accent);
  color: #fff;
}

.sub-actions .sub-btn-export:hover {
  background: var(--accent-hover);
}

.sub-actions .sub-btn-export:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.sub-export-progress {
  width: 100%;
  text-align: center;
  padding: 8px 0;
  color: var(--accent);
  font-size: 13px;
}

/* SweetAlert2 compact overrides */
html.swal2-height-auto, body.swal2-height-auto {
  height: 100vh !important;
}
.swal2-container {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
.swal2-popup {
  padding: 0.6em 1.5em 0.4em !important;
  font-size: 14px !important;
  border-radius: 12px !important;
}
.swal2-icon { width: 2em !important; height: 2em !important; min-width: auto !important; margin: 0 auto !important; border-width: 2px !important; font-size: 1.2em !important; line-height: 2em !important; }
.swal2-icon .swal2-icon-content { font-size: 1.2em !important; }
.swal2-title { font-size: 1.1em !important; margin: 0 !important; padding: 0 !important; }
.swal2-html-container { font-size: 0.9em !important; margin: 0.4em 0 0 !important; padding: 0 !important; }
.swal2-actions { margin: 0.6em 0 0 !important; padding: 0 !important; }
.swal2-styled { padding: 0.45em 1.8em !important; font-size: 13px !important; border-radius: 6px !important; margin: 0.2em !important; }
.swal2-input, .swal2-textarea { margin: 0.5em 0 0 !important; font-size: 13px !important; }
.swal2-validation-message { margin: 0.3em 0 0 !important; padding: 0.3em 0.8em !important; font-size: 12px !important; }
.swal2-footer { display: none !important; }
.swal2-timer-progress-bar-container { display: none !important; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>ReelMaker</h1>
  <select id="topicSelect"></select>
  <input type="text" id="topicName" placeholder="主題名稱" style="width:120px">
  <button id="btnNew">新建</button>
  <button id="btnDelete" class="danger">刪除</button>
  <span class="spacer"></span>
  <div class="source-group" style="margin-right:12px">
    <label><input type="radio" name="renderMode" value="mindmap" checked> 心智圖</label>
    <label><input type="radio" name="renderMode" value="slides"> 簡報</label>
  </div>
  <select id="mmTheme">
    <option value="navy">深藍</option>
    <option value="dark">暗黑</option>
    <option value="light">淺色</option>
    <option value="cream">奶油</option>
  </select>
  <button id="btnLayout">排版</button>
  <button id="btnRecord" class="primary">錄影</button>
  <button id="btnFullscreen" title="全螢幕 (F11)" aria-label="全螢幕">⛶</button>
  <a href="/admin" target="_blank" style="font-size:12px;color:var(--text-muted);text-decoration:none;margin-left:4px" title="拍攝企劃後台">企劃</a>
</div>

<div class="main">
  <div class="editor-pane">
    <div class="editor-tabs">
      <button class="editor-tab active" data-tab="edit">編輯</button>
      <button class="editor-tab" data-tab="preview">預覽</button>
    </div>
    <textarea id="editor" placeholder="# 你的主題&#10;## 第一點&#10;- 子項目 A&#10;- 子項目 B&#10;## 第二點&#10;- 子項目 C"></textarea>
    <div class="editor-preview" id="editorPreview" style="display:none">
      <div class="ep-video-wrap" id="epVideoWrap" style="display:none">
        <video id="epVideo" controls></video>
      </div>
      <div class="ep-slide-preview" id="epSlidePreview"></div>
      <div class="ep-slide-label" id="epSlideLabel" style="display:none"></div>
      <div class="ep-storyboard" id="epStoryboard"></div>
      <div class="ep-empty" id="epEmpty">尚無分鏡或影片</div>
    </div>
  </div>
  <div class="preview-pane" id="previewPane">
    <svg id="markmap"></svg>
    <div class="slide-container" id="slideContainer"></div>
    <div class="slide-nav" id="slideNav"></div>
    <div class="storyboard-overlay" id="storyboardOverlayInner"><div class="sb-nav" id="sbNav"></div></div>
    <div class="wb-layer" id="wbLayer">
      <canvas id="wbCanvas"></canvas>
    </div>
  </div>
  <div class="bg-layer" id="bgLayer">
    <div class="slides-bg" id="slidesBg"></div>
    <video id="bgVideo" loop playsinline></video>
    <video id="webcamVideo" autoplay muted playsinline></video>
    <canvas id="bg3d"></canvas>
    <video id="bg3dVideo" loop muted playsinline></video>
  </div>
</div>

<div class="rec-controls">
  <div class="rec-timer" id="recTimer"><span class="live-dot"></span><span id="recTime">00:00</span></div>
  <button class="rec-btn" id="recBtn" title="開始錄影"><div class="dot"></div></button>
  <select id="splitSelect" class="split-select" title="上下比例">
    <option value="30">30:70</option>
    <option value="40">40:60</option>
    <option value="50" selected>50:50</option>
    <option value="60">60:40</option>
    <option value="70">70:30</option>
  </select>
  <button class="swap-btn" id="swapBtn" title="交換上下位置">&#8645;</button>
  <div class="rec-bg-select" id="recBgSelect">
    <select id="recBgSource">
      <option value="3d">3D場景</option>
      <option value="slides">簡報</option>
      <option value="upload">上傳影片</option>
      <option value="webcam">Webcam</option>
    </select>
  </div>
  <div class="rec-audio-controls">
    <label class="rec-audio-label">&#127908;</label>
    <select id="micSelect"><option value="">無麥克風</option></select>
    <input type="range" id="micGain" min="0" max="3" step="0.1" value="1.5" title="麥克風音量">
  </div>
</div>
<div class="draw-tools" id="drawTools">
  <button id="dtPen" title="畫筆">&#9998;</button>
  <button id="dtEraser" title="橡皮擦">&#9003;</button>
  <div class="sep"></div>
  <input type="color" id="dtColor" value="#ff4757" title="畫筆顏色">
  <div class="sep"></div>
  <button id="dtImg" title="貼圖">&#128444;</button>
  <button id="dtClear" title="清除全部">&#128465;</button>
</div>
<input type="file" id="wbImgFile" accept="image/*" style="display:none">

<div class="rec-exit" id="recExit">ESC 退出錄影模式</div>

<div class="storyboard-panel" id="storyboardPanel">
  <div class="storyboard-panel-header">分鏡</div>
  <div class="storyboard-panel-grid" id="sbPanelGrid"></div>
</div>

<div class="sfx-panel" id="sfxPanel">
  <div class="sfx-panel-header">音效</div>
  <div class="sfx-grid" id="sfxGrid"></div>
</div>

<div class="teleprompter" id="teleprompter">
  <div class="teleprompter-header">提詞便利貼</div>
  <textarea id="prompterText" placeholder="在這裡寫提詞稿...&#10;&#10;只有你看得到，不會錄進去"></textarea>
  <div class="font-controls">
    <button id="fontMinus" title="縮小字體">A-</button>
    <button id="fontPlus" title="放大字體">A+</button>
  </div>
</div>

<div class="bottom-bar">
  <span style="font-size:13px;color:var(--text-muted)">底圖：</span>
  <div class="source-group">
    <label><input type="radio" name="bgSource" value="3d" checked> 3D場景</label>
    <label><input type="radio" name="bgSource" value="slides"> 簡報</label>
    <label><input type="radio" name="bgSource" value="upload"> 上傳影片</label>
    <label><input type="radio" name="bgSource" value="webcam"> Webcam</label>
  </div>
  <select id="sceneSelect" class="scene-select">
    <option value="grassland">草原漫步</option>
    <option value="cave">洞窟探險</option>
    <option value="sky">天空之城</option>
    <option value="ocean">海底世界</option>
  </select>
  <input type="color" id="bgColor" value="#000000" title="背景色">
  <input type="file" id="videoFile" accept="video/*">
  <label class="file-label" id="videoFileLabel" for="videoFile">選擇影片</label>
  <button class="file-label" id="videoUrlBtn" style="display:none">貼上網址</button>
  <div class="video-controls" id="videoControls">
    <button id="vcPlay" title="播放/暫停">▶</button>
    <input type="range" id="vcVolume" min="0" max="1" step="0.05" value="0.5">
    <span id="vcTime" class="vc-time">0:00</span>
  </div>
  <span style="width:1px;height:20px;background:var(--border);margin:0 8px"></span>
  <div class="storyboard-bar">
    <span style="font-size:13px;color:var(--text-muted)">分鏡：</span>
    <button id="sbAdd" class="sb-add-btn" title="上傳分鏡圖">+</button>
    <button id="sbFromAssets" class="sb-add-btn" title="從素材庫" style="font-size:11px">素材庫</button>
    <button id="sbFromUrl" class="sb-add-btn" title="貼上圖片網址" style="font-size:11px">網址</button>
    <div class="sb-bar-thumbs" id="sbBarThumbs"></div>
    <input type="file" id="sbFileInput" accept="image/*" multiple style="display:none">
  </div>
  <span style="width:1px;height:20px;background:var(--border);margin:0 8px"></span>
  <div class="edit-draw-tools">
    <button id="edPen">畫筆</button>
    <button id="edImg">貼圖</button>
    <button id="edClear">清除</button>
  </div>
</div>

<script>
(function() {
  'use strict'

  // --- Modal helpers (SweetAlert2) ---

  // Monkey-patch Swal.fire — 每個彈窗 didOpen 結尾自動套 compact style
  function _swalCompact(popup) {
    popup.style.padding = '6px 21px 5px'
    const icon = popup.querySelector('.swal2-icon')
    if (icon) {
      icon.style.width = '2em'
      icon.style.height = '2em'
      icon.style.minWidth = 'auto'
      icon.style.margin = '0 auto'
      icon.style.borderWidth = '2px'
      icon.style.fontSize = '1.2em'
      icon.style.lineHeight = '2em'
      const inner = icon.querySelector('.swal2-icon-content')
      if (inner) inner.style.fontSize = '1.2em'
    }
    const title = popup.querySelector('.swal2-title')
    if (title) { title.style.margin = '6px 0 0'; title.style.padding = '0' }
    const html = popup.querySelector('.swal2-html-container')
    if (html) { html.style.margin = '4px 0 0'; html.style.padding = '0' }
    const actions = popup.querySelector('.swal2-actions')
    if (actions) { actions.style.margin = '8px 0 0'; actions.style.padding = '0' }
    const footer = popup.querySelector('.swal2-footer')
    if (footer) footer.style.display = 'none'
  }
  const _origSwalFire = Swal.fire.bind(Swal)
  Swal.fire = function(opts) {
    if (typeof opts === 'object' && opts !== null) {
      const origDidOpen = opts.didOpen
      opts = { ...opts, didOpen: (popup) => {
        if (origDidOpen) origDidOpen(popup)
        _swalCompact(popup)
      }}
    }
    return _origSwalFire(opts)
  }

  const swalDark = {
    background: '#1e1e1e',
    color: '#ececec',
    confirmButtonColor: '#ff6b4a',
    cancelButtonColor: '#444',
    width: '22em',
    iconColor: '#6ec1e4',
  }

  async function appConfirm(text, title = '確認') {
    const r = await Swal.fire({
      title, text, icon: 'question',
      showCancelButton: true,
      confirmButtonText: '確定',
      cancelButtonText: '取消',
      ...swalDark,
    })
    return r.isConfirmed
  }

  async function appPrompt(title, inputPlaceholder = '') {
    const r = await Swal.fire({
      title, input: 'text', inputPlaceholder,
      showCancelButton: true,
      confirmButtonText: '確定',
      cancelButtonText: '取消',
      ...swalDark,
    })
    return r.isConfirmed ? (r.value || '').trim() : null
  }

  function appAlert(text, title = '提示', icon = 'info') {
    return Swal.fire({ title, text, icon, ...swalDark })
  }

  // --- API helpers ---

  async function apiGet(url) {
    const r = await fetch(url)
    return r.json()
  }

  async function apiPost(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })
    return r.json()
  }

  async function apiPut(url, body) {
    const r = await fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })
    return r.json()
  }

  async function apiDelete(url) {
    const r = await fetch(url, { method: 'DELETE' })
    return r.json()
  }

  // DOM refs
  const editor = document.getElementById('editor')
  const svgEl = document.getElementById('markmap')
  const topicSelect = document.getElementById('topicSelect')
  const topicName = document.getElementById('topicName')
  const btnNew = document.getElementById('btnNew')
  const btnDelete = document.getElementById('btnDelete')
  const btnRecord = document.getElementById('btnRecord')
  const bgLayer = document.getElementById('bgLayer')
  const slidesBg = document.getElementById('slidesBg')
  const bgVideo = document.getElementById('bgVideo')
  const webcamVideo = document.getElementById('webcamVideo')
  const bgColor = document.getElementById('bgColor')
  const videoFile = document.getElementById('videoFile')
  const sourceRadios = document.querySelectorAll('input[name="bgSource"]')
  const bg3d = document.getElementById('bg3d')
  const sceneSelect = document.getElementById('sceneSelect')
  const splitSelect = document.getElementById('splitSelect')
  const swapBtn = document.getElementById('swapBtn')
  const recBgSource = document.getElementById('recBgSource')
  const micSelect = document.getElementById('micSelect')
  const micGainSlider = document.getElementById('micGain')
  const recBtn = document.getElementById('recBtn')
  const recTimer = document.getElementById('recTimer')
  const recTimeSpan = document.getElementById('recTime')
  const prompterText = document.getElementById('prompterText')
  const fontMinus = document.getElementById('fontMinus')
  const fontPlus = document.getElementById('fontPlus')
  const previewPane = document.getElementById('previewPane')
  const slideContainer = document.getElementById('slideContainer')
  const slideNav = document.getElementById('slideNav')
  const renderModeRadios = document.querySelectorAll('input[name="renderMode"]')
  const mmThemeSelect = document.getElementById('mmTheme')
  const btnLayout = document.getElementById('btnLayout')
  const wbLayer = document.getElementById('wbLayer')
  const wbCanvas = document.getElementById('wbCanvas')
  const wbCtx = wbCanvas.getContext('2d')
  const wbImgFile = document.getElementById('wbImgFile')
  const dtPen = document.getElementById('dtPen')
  const dtEraser = document.getElementById('dtEraser')
  const dtColor = document.getElementById('dtColor')
  const dtImg = document.getElementById('dtImg')
  const dtClear = document.getElementById('dtClear')
  const edPen = document.getElementById('edPen')
  const edImg = document.getElementById('edImg')
  const edClear = document.getElementById('edClear')
  const bg3dVideo = document.getElementById('bg3dVideo')
  const storyboardPanel = document.getElementById('storyboardPanel')
  const sbPanelGrid = document.getElementById('sbPanelGrid')
  const sbBarThumbs = document.getElementById('sbBarThumbs')
  const sbAdd = document.getElementById('sbAdd')
  const sbFromAssets = document.getElementById('sbFromAssets')
  const sbFromUrl = document.getElementById('sbFromUrl')
  const sbFileInput = document.getElementById('sbFileInput')
  const storyboardOverlay = document.getElementById('storyboardOverlayInner')
  const sbNav = document.getElementById('sbNav')
  const videoUrlBtn = document.getElementById('videoUrlBtn')
  const videoControls = document.getElementById('videoControls')
  const vcPlay = document.getElementById('vcPlay')
  const vcVolume = document.getElementById('vcVolume')
  const vcTime = document.getElementById('vcTime')
  const editorTabs = document.querySelectorAll('.editor-tab')
  const editorPreview = document.getElementById('editorPreview')
  const epVideoWrap = document.getElementById('epVideoWrap')
  const epVideo = document.getElementById('epVideo')
  const epSlidePreview = document.getElementById('epSlidePreview')
  const epSlideLabel = document.getElementById('epSlideLabel')
  const epStoryboard = document.getElementById('epStoryboard')
  const epEmpty = document.getElementById('epEmpty')

  // State
  let topics = []
  let currentIndex = 0
  let saveTimer = null
  let mediaRecorder = null
  let recordedChunks = []
  let recStartTime = 0
  let recTickInterval = null
  let mm = null
  let webcamStream = null
  let activeStoryboard = -1 // index of currently shown storyboard, -1 = none
  let slidesIndex = 0 // current slide in "簡報" background mode

  // --- Mindmap Theme ---

  const MM_THEMES = {
    navy: {
      bg: '#0d1117',
      text: '#ffffff',
      palette: ['#ff6b9d', '#ffc93c', '#6dd5ed', '#a8e6cf', '#c3aed6', '#ff9a76', '#74b9ff', '#fd79a8', '#55efc4', '#81ecec']
    },
    dark: {
      bg: '#000000',
      text: '#ffffff',
      palette: ['#ff6b9d', '#ffc93c', '#6dd5ed', '#a8e6cf', '#c3aed6', '#ff9a76', '#74b9ff', '#fd79a8', '#55efc4', '#81ecec']
    },
    light: {
      bg: '#ffffff',
      text: '#121212',
      palette: ['#e91e63', '#f57c00', '#1976d2', '#388e3c', '#7b1fa2', '#c62828', '#00838f', '#4527a0', '#ef6c00', '#2e7d32']
    },
    cream: {
      bg: '#fdf6e3',
      text: '#2d2d2d',
      palette: ['#d33682', '#cb4b16', '#268bd2', '#859900', '#6c71c4', '#b58900', '#2aa198', '#dc322f', '#657b83', '#586e75']
    }
  }

  let currentMmTheme = 'navy'
  mmThemeSelect.value = currentMmTheme

  function applyMmTheme(rerender) {
    const theme = MM_THEMES[currentMmTheme]
    document.documentElement.style.setProperty('--mm-bg', theme.bg)
    document.documentElement.style.setProperty('--mm-text', theme.text)
    if (rerender && mm) {
      mm = null
      svgEl.innerHTML = ''
      renderMarkmap()
    }
  }

  mmThemeSelect.addEventListener('change', () => {
    currentMmTheme = mmThemeSelect.value
    apiPut('/api/settings/mm_theme', { value: currentMmTheme })
    applyMmTheme(true)
  })

  // Set initial CSS variables (markmap renders later during init)
  applyMmTheme(false)

  // --- Topic Management ---

  async function loadTopics() {
    const data = await apiGet('/api/topics')
    topics = data.topics || []
    if (topics.length === 0) {
      topics = [{ name: '空白', markdown: '# 空白' }]
    }
  }

  function renderTopicSelect() {
    topicSelect.innerHTML = topics
      .map((t, i) => `<option value="${i}">${t.name}</option>`)
      .join('')
    topicSelect.value = currentIndex
    topicName.value = topics[currentIndex].name
  }

  function switchTopic(index) {
    currentIndex = index
    editor.value = topics[currentIndex].markdown
    topicName.value = topics[currentIndex].name
    topicSelect.value = currentIndex
    renderMarkmap()
    renderStoryboards()
  }

  function autoSave() {
    clearTimeout(saveTimer)
    saveTimer = setTimeout(() => {
      const topic = topics[currentIndex]
      if (!topic || !topic.id) return
      const updates = {
        markdown: editor.value,
        name: topicName.value,
      }
      topics[currentIndex] = { ...topic, ...updates }
      renderTopicSelect()
      apiPut('/api/topics/' + topic.id, updates)
    }, 1000)
  }

  // --- Markmap ---

  function forceTextColor() {
    const c = MM_THEMES[currentMmTheme].text
    // SVG <text> (old markmap)
    svgEl.querySelectorAll('text').forEach(t => {
      t.setAttribute('fill', c)
      t.style.setProperty('fill', c, 'important')
    })
    // foreignObject HTML (new markmap) — this is the actual one
    svgEl.querySelectorAll('foreignObject div, foreignObject span, foreignObject p').forEach(el => {
      el.style.setProperty('color', c, 'important')
      el.style.setProperty('font-weight', '600', 'important')
    })
  }

  // Persistent interval — Markmap d3 transitions continuously
  // reset inline fill during animation, so we need to keep overriding
  let textInterval = null
  function startTextEnforcer() {
    if (textInterval) return
    textInterval = setInterval(forceTextColor, 100)
  }

  function renderMarkmap() {
    const { Transformer } = window.markmap
    const transformer = new Transformer()
    const { root } = transformer.transform(editor.value || '# 空白')
    const palette = MM_THEMES[currentMmTheme].palette
    if (!mm) {
      mm = window.markmap.Markmap.create(svgEl, {
        color: (node) => palette[node.state.depth % palette.length],
        duration: 300,
        maxWidth: 200,
        paddingX: 16,
      }, root)
    } else {
      mm.setData(root)
      mm.fit()
    }
    startTextEnforcer()
  }

  // --- Slide Renderer ---

  let slides = []
  let currentSlide = 0

  function parseSlides(md) {
    const lines = md.split('\n')
    const result = []
    let current = null

    for (const line of lines) {
      const trimmed = line.trim()
      if (trimmed.startsWith('## ')) {
        if (current) result.push(current)
        current = { title: trimmed.slice(3), img: null, items: [] }
      } else if (trimmed.startsWith('# ') && !current) {
        // Title slide
        current = { title: trimmed.slice(2), img: null, items: [], isTitle: true }
      } else if (current) {
        const imgMatch = trimmed.match(/^!\[.*?\]\((.+?)\)/)
        if (imgMatch) {
          current.img = imgMatch[1]
        } else if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
          current.items.push(trimmed.slice(2))
        }
      }
    }
    if (current) result.push(current)
    return result
  }

  function renderSlide(index) {
    if (index < 0 || index >= slides.length) return
    currentSlide = index
    const s = slides[index]

    let html = '<div class="slide-card">'
    if (s.img) html += '<img class="slide-img" src="' + s.img + '" alt="">'
    html += '<div class="slide-title">' + s.title + '</div>'
    if (s.items.length) {
      html += '<ul class="slide-items">'
      for (const item of s.items) {
        html += '<li>' + item + '</li>'
      }
      html += '</ul>'
    }
    html += '</div>'
    slideContainer.innerHTML = html

    // Update nav dots
    slideNav.innerHTML = slides.map((_, i) =>
      '<div class="dot' + (i === index ? ' active' : '') + '"></div>'
    ).join('')
  }

  function getRenderMode() {
    for (const r of renderModeRadios) {
      if (r.checked) return r.value
    }
    return 'mindmap'
  }

  function updateRenderMode() {
    const mode = getRenderMode()
    if (mode === 'mindmap') {
      svgEl.style.display = ''
      slideContainer.classList.remove('visible')
      slideNav.style.display = 'none'
      renderMarkmap()
    } else {
      svgEl.style.display = 'none'
      slideContainer.classList.add('visible')
      slideNav.style.display = 'flex'
      slides = parseSlides(editor.value || '')
      currentSlide = 0
      if (slides.length) renderSlide(0)
    }
  }

  renderModeRadios.forEach(r => {
    r.addEventListener('change', updateRenderMode)
  })

  // Slide navigation — click or arrow keys
  slideContainer.addEventListener('click', () => {
    if (currentSlide < slides.length - 1) {
      renderSlide(currentSlide + 1)
    }
  })

  document.addEventListener('keydown', (e) => {
    if (getRenderMode() !== 'slides') return
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault()
      if (currentSlide < slides.length - 1) renderSlide(currentSlide + 1)
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault()
      if (currentSlide > 0) renderSlide(currentSlide - 1)
    }
  })

  // --- Layout Mode ---

  let isLayout = false

  btnLayout.addEventListener('click', () => {
    if (isLayout) {
      exitLayoutMode()
    } else {
      enterLayoutMode()
    }
  })

  function enterLayoutMode() {
    isLayout = true
    document.body.classList.add('layout')
    btnLayout.textContent = '返回編輯'
    btnLayout.classList.add('primary')
    updateRenderMode()
    setTimeout(() => {
      if (mm && getRenderMode() === 'mindmap') mm.fit()
      resizeWbCanvas()
    }, 150)
  }

  function exitLayoutMode() {
    isLayout = false
    document.body.classList.remove('layout')
    btnLayout.textContent = '排版'
    btnLayout.classList.remove('primary')
    setTimeout(() => {
      if (mm) mm.fit()
      resizeWbCanvas()
    }, 150)
  }

  // --- Background ---

  function getSelectedSource() {
    for (const r of sourceRadios) {
      if (r.checked) return r.value
    }
    return '3d'
  }

  function updateBgVisibility() {
    const source = getSelectedSource()
    slidesBg.style.display = source === 'slides' ? 'block' : 'none'
    bgVideo.style.display = source === 'upload' ? 'block' : 'none'
    webcamVideo.style.display = source === 'webcam' ? 'block' : 'none'
    bg3d.style.display = source === '3d' ? 'block' : 'none'
    bgColor.style.display = 'none'
    document.getElementById('videoFileLabel').style.display = source === 'upload' ? 'inline-block' : 'none'
    videoUrlBtn.style.display = source === 'upload' ? 'inline-block' : 'none'
    videoControls.style.display = (source === 'upload' && bgVideo.src) ? 'inline-flex' : 'none'
    sceneSelect.style.display = source === '3d' ? 'inline-block' : 'none'

    if (source === 'webcam') {
      startWebcam()
    } else {
      stopWebcam()
    }

    if (source === '3d') {
      // Only start if canvas is actually visible (has dimensions)
      if (bg3d.clientWidth > 0 && bg3d.clientHeight > 0) {
        start3DScene()
      }
    } else {
      stop3DScene()
    }

    if (source === 'slides') {
      renderSlidesBg()
    }
  }

  function renderSlidesBg() {
    const sb = getStoryboards()
    slidesBg.innerHTML = ''
    if (sb.length === 0) return

    slidesIndex = Math.max(0, Math.min(slidesIndex, sb.length - 1))

    const img = document.createElement('img')
    img.src = sb[slidesIndex].url || sb[slidesIndex].dataUrl || ''
    img.alt = '簡報 ' + (slidesIndex + 1)
    slidesBg.appendChild(img)

    if (sb.length > 1) {
      const nav = document.createElement('div')
      nav.className = 'slides-nav'
      sb.forEach((_, i) => {
        const dot = document.createElement('span')
        dot.className = 'slides-dot' + (i === slidesIndex ? ' active' : '')
        dot.addEventListener('click', () => {
          slidesIndex = i
          renderSlidesBg()
        })
        nav.appendChild(dot)
      })
      slidesBg.appendChild(nav)
    }
  }

  function startWebcam() {
    if (webcamStream) return
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => {
        webcamStream = stream
        webcamVideo.srcObject = stream
      })
      .catch(err => {
        console.error('Webcam access denied:', err)
        appAlert('無法取得 Webcam 權限', '錯誤', 'error')
      })
  }

  function stopWebcam() {
    if (webcamStream) {
      webcamStream.getTracks().forEach(t => t.stop())
      webcamStream = null
      webcamVideo.srcObject = null
    }
  }

  // --- Recording Mode ---

  let isRecording = false

  function enterRecordingMode() {
    if (isLayout) exitLayoutMode()
    isRecording = true
    document.body.classList.add('recording')
    bgLayer.style.display = 'flex'
    recBgSource.value = getSelectedSource()
    updateBgVisibility()
    enumerateMics()
    updateRenderMode()

    if (getSelectedSource() === 'upload' && bgVideo.src) {
      bgVideo.muted = true
      bgVideo.play()
    }

    setTimeout(() => {
      if (mm && getRenderMode() === 'mindmap') mm.fit()
      resizeWbCanvas()
      // 3D scene: now bgLayer is visible, start or resize
      if (getSelectedSource() === '3d') {
        if (!scene3d) {
          init3DScene()
          animate3D()
        } else if (renderer3d) {
          renderer3d.setSize(bg3d.clientWidth, bg3d.clientHeight)
          camera3d.aspect = bg3d.clientWidth / bg3d.clientHeight
          camera3d.updateProjectionMatrix()
        }
      }
    }, 200)
  }

  function exitRecordingMode() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      stopCapture()
    }
    wbMode = 'none'
    wbLayer.classList.remove('active')
    isRecording = false
    document.body.classList.remove('recording')
    document.body.classList.remove('swapped')
    bgLayer.style.display = 'none'

    if (bgVideo.src) {
      bgVideo.pause()
      bgVideo.muted = false
    }

    setTimeout(() => {
      if (mm) mm.fit()
      resizeWbCanvas()
    }, 150)
  }

  // --- Screen Capture ---

  function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000)
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0')
    const s = String(totalSec % 60).padStart(2, '0')
    return m + ':' + s
  }

  let captureCanvas = null
  let captureCtx = null
  let captureVideo = null
  let captureRaf = null
  let micStream = null
  let displayStream = null
  let captureAudioCtx = null

  async function enumerateMics() {
    try {
      // Need permission first to get device labels
      const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true })
      tempStream.getTracks().forEach(t => t.stop())

      const devices = await navigator.mediaDevices.enumerateDevices()
      const audioInputs = devices.filter(d => d.kind === 'audioinput')
      micSelect.innerHTML = '<option value="">不使用麥克風</option>' +
        audioInputs.map(d =>
          '<option value="' + d.deviceId + '">' + (d.label || '麥克風 ' + d.deviceId.slice(0, 4)) + '</option>'
        ).join('')
      // Auto-select first real mic
      if (audioInputs.length > 0) {
        micSelect.value = audioInputs[0].deviceId
      }
    } catch (e) {
      micSelect.innerHTML = '<option value="">麥克風權限被拒</option>'
    }
  }

  async function startCapture() {
    try {
      // 1. Get display stream (current tab) — include system audio
      displayStream = await navigator.mediaDevices.getDisplayMedia({
        video: { displaySurface: 'browser' },
        audio: true,
        preferCurrentTab: true
      })

      // 2. Get microphone (use selected device)
      const selectedMicId = micSelect.value
      if (selectedMicId) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { deviceId: { exact: selectedMicId } }
          })
        } catch (e) {
          micStream = null
        }
      } else {
        micStream = null
      }

      // 3. Set up canvas for 9:16 crop (720p for lighter encoding)
      captureCanvas = document.createElement('canvas')
      captureCanvas.width = 720
      captureCanvas.height = 1280
      captureCtx = captureCanvas.getContext('2d')

      captureVideo = document.createElement('video')
      captureVideo.srcObject = displayStream
      captureVideo.muted = true
      await captureVideo.play()

      // Wait for video dimensions to be available
      await new Promise(resolve => {
        if (captureVideo.videoWidth > 0) return resolve()
        captureVideo.onloadedmetadata = resolve
      })

      // 5. Draw loop — crop center 9:16 from tab capture + storyboard overlay
      function drawFrame() {
        const srcW = captureVideo.videoWidth
        const srcH = captureVideo.videoHeight
        if (srcW && srcH) {
          const targetRatio = 9 / 16
          const srcRatio = srcW / srcH
          let cropX, cropY, cropW, cropH
          if (srcRatio > targetRatio) {
            cropH = srcH
            cropW = srcH * targetRatio
            cropX = (srcW - cropW) / 2
            cropY = 0
          } else {
            cropW = srcW
            cropH = srcW / targetRatio
            cropX = 0
            cropY = (srcH - cropH) / 2
          }
          captureCtx.drawImage(captureVideo, cropX, cropY, cropW, cropH, 0, 0, 720, 1280)

          // Draw storyboard overlay onto canvas if visible
          const sbImg = storyboardOverlay.querySelector('img')
          if (sbImg && sbImg.complete && sbImg.naturalWidth && storyboardOverlay.classList.contains('visible')) {
            const paneRect = previewPane.getBoundingClientRect()
            const imgRect = sbImg.getBoundingClientRect()
            const relX = (imgRect.left + imgRect.width / 2 - paneRect.left) / paneRect.width
            const relY = (imgRect.top + imgRect.height / 2 - paneRect.top) / paneRect.height
            const scale = Math.min(
              (720 * 0.9) / sbImg.naturalWidth,
              (1280 * 0.9) / sbImg.naturalHeight
            )
            const drawW = sbImg.naturalWidth * scale
            const drawH = sbImg.naturalHeight * scale
            const drawX = relX * 720 - drawW / 2
            const drawY = relY * 1280 - drawH / 2
            captureCtx.drawImage(sbImg, drawX, drawY, drawW, drawH)
          }
        }
        captureRaf = requestAnimationFrame(drawFrame)
      }
      drawFrame()

      // 6. Combine canvas video + all audio (system + mic)
      const canvasStream = captureCanvas.captureStream(24)
      const tracks = [...canvasStream.getVideoTracks()]

      // Merge system audio + mic audio via AudioContext with gain control
      const systemAudioTracks = displayStream.getAudioTracks()
      const micAudioTracks = micStream ? micStream.getAudioTracks() : []
      if (systemAudioTracks.length > 0 || micAudioTracks.length > 0) {
        const audioCtx = new AudioContext()
        const dest = audioCtx.createMediaStreamDestination()
        if (systemAudioTracks.length > 0) {
          const sysSource = audioCtx.createMediaStreamSource(new MediaStream(systemAudioTracks))
          sysSource.connect(dest)
        }
        if (micAudioTracks.length > 0) {
          const micSource = audioCtx.createMediaStreamSource(new MediaStream(micAudioTracks))
          const micGainNode = audioCtx.createGain()
          micGainNode.gain.value = parseFloat(micGainSlider.value)
          micSource.connect(micGainNode)
          micGainNode.connect(dest)
          // Live adjust mic gain
          micGainSlider.oninput = () => { micGainNode.gain.value = parseFloat(micGainSlider.value) }
        }
        tracks.push(...dest.stream.getAudioTracks())
        captureAudioCtx = audioCtx
      }
      const combinedStream = new MediaStream(tracks)

      // 7. Record
      recordedChunks = []
      mediaRecorder = new MediaRecorder(combinedStream, {
        mimeType: 'video/webm',
        videoBitsPerSecond: 8_000_000,
      })

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data)
      }

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' })
        const duration = Date.now() - recStartTime
        const topicLabel = (topics[currentIndex] || {}).name || 'recording'
        const filename = topicLabel + '_' + new Date().toISOString().slice(0, 10) + '.webm'
        showPostRecordModal(blob, filename, duration)
        cleanupCapture()
      }

      // If user stops sharing via browser UI
      displayStream.getVideoTracks()[0].onended = () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') stopCapture()
      }

      mediaRecorder.start(200)
      recStartTime = Date.now()
      recBtn.classList.add('is-recording')
      recBtn.title = '停止錄影'
      recTimer.classList.add('visible')

      recTickInterval = setInterval(() => {
        recTimeSpan.textContent = formatTime(Date.now() - recStartTime)
      }, 500)

    } catch (err) {
      console.error('Screen capture failed:', err)
      cleanupCapture()
    }
  }

  function stopCapture() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop()
    }
  }

  function cleanupCapture() {
    cancelAnimationFrame(captureRaf)
    captureRaf = null
    if (displayStream) { displayStream.getTracks().forEach(t => t.stop()); displayStream = null }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null }
    if (captureVideo) { captureVideo.pause(); captureVideo.srcObject = null; captureVideo = null }
    if (captureAudioCtx) { captureAudioCtx.close(); captureAudioCtx = null }
    captureCanvas = null
    captureCtx = null
    recBtn.classList.remove('is-recording')
    recBtn.title = '開始錄影'
    recTimer.classList.remove('visible')
    clearInterval(recTickInterval)
    recTickInterval = null
    recTimeSpan.textContent = '00:00'
    // Restore live 3D after recording ends
    if (getSelectedSource() === '3d' && bg3dVideo.style.display !== 'none') {
      deactivatePreRendered()
    }
  }

  // --- Split Ratio Dropdown ---

  let splitTop = 50
  splitSelect.value = splitTop
  document.documentElement.style.setProperty('--split-top', splitTop + '%')
  document.documentElement.style.setProperty('--split-bottom', (100 - splitTop) + '%')

  function applySplit(val) {
    splitTop = val
    splitSelect.value = splitTop
    document.documentElement.style.setProperty('--split-top', splitTop + '%')
    document.documentElement.style.setProperty('--split-bottom', (100 - splitTop) + '%')
  }

  splitSelect.addEventListener('change', () => {
    applySplit(parseInt(splitSelect.value, 10))
    apiPut('/api/settings/split', { value: splitTop })
    if (renderer3d && bg3d.clientWidth > 0 && bg3d.clientHeight > 0) {
      setTimeout(() => {
        renderer3d.setSize(bg3d.clientWidth, bg3d.clientHeight)
        camera3d.aspect = bg3d.clientWidth / bg3d.clientHeight
        camera3d.updateProjectionMatrix()
      }, 50)
    }
  })

  // --- 3D Minecraft Parkour Scene ---

  let scene3d = null
  let camera3d = null
  let renderer3d = null
  let raf3d = null
  let terrainChunks = []
  let handGroup = null
  let cameraZ = 0
  let cameraTime = 0
  const CHUNK_SIZE = 16
  const VIEW_DIST = 6
  const BLOCK_SIZE = 1

  // Value noise
  const noiseCache = {}
  function pseudoRandom(x, z) {
    const key = x + ',' + z
    if (noiseCache[key] !== undefined) return noiseCache[key]
    const n = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453
    const val = n - Math.floor(n)
    noiseCache[key] = val
    return val
  }

  function lerp(a, b, t) { return a + (b - a) * t }

  function smoothNoise(x, z) {
    const ix = Math.floor(x)
    const iz = Math.floor(z)
    const fx = x - ix
    const fz = z - iz
    const tx = fx * fx * (3 - 2 * fx)
    const tz = fz * fz * (3 - 2 * fz)
    return lerp(
      lerp(pseudoRandom(ix, iz), pseudoRandom(ix + 1, iz), tx),
      lerp(pseudoRandom(ix, iz + 1), pseudoRandom(ix + 1, iz + 1), tx),
      tz
    )
  }

  function fbmNoise(x, z, octaves) {
    let val = 0, amp = 1, freq = 1, max = 0
    for (let i = 0; i < octaves; i++) {
      val += smoothNoise(x * freq, z * freq) * amp
      max += amp
      amp *= 0.5
      freq *= 2
    }
    return val / max
  }

  // --- First Person Hand + Sword ---

  function createHand() {
    const group = new THREE.Group()

    function handMat(color) {
      return new THREE.MeshLambertMaterial({ color, depthTest: false })
    }
    function addPart(geo, color, pos, rot) {
      const m = new THREE.Mesh(geo, handMat(color))
      m.position.set(pos[0], pos[1], pos[2])
      if (rot) m.rotation.set(rot[0], rot[1], rot[2])
      m.renderOrder = 999
      group.add(m)
      return m
    }

    // --- Minecraft-style arm (4x12x4 pixel proportion, blocky) ---
    addPart(
      new THREE.BoxGeometry(0.22, 0.65, 0.22),
      0xc68642, // Minecraft Steve skin tone
      [0, -0.25, -0.1],
      [-0.4, 0, 0.2]
    )

    // --- Diamond Sword (flat pixel-art style, like a sprite) ---
    // The sword is flat (thin Z), wide X, tall Y — like the inventory icon
    const swordGroup = new THREE.Group()
    swordGroup.position.set(0.02, 0.3, -0.25)
    swordGroup.rotation.set(-0.7, 0.1, 0.6) // Diagonal hold angle

    // Handle (dark brown, 2px wide)
    addPart(new THREE.BoxGeometry(0.06, 0.22, 0.03), 0x4a3728, [0, -0.08, 0]).parent = null
    const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.22, 0.03), handMat(0x4a3728))
    hilt.position.set(0, -0.08, 0)
    hilt.renderOrder = 999
    swordGroup.add(hilt)

    // Handle wrap (slightly lighter)
    const wrap = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.08, 0.035), handMat(0x2e7d32))
    wrap.position.set(0, -0.04, 0)
    wrap.renderOrder = 999
    swordGroup.add(wrap)

    // Guard / crossguard (wider, gold-ish)
    const crossguard = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.05, 0.04), handMat(0x5d4e37))
    crossguard.position.set(0, 0.06, 0)
    crossguard.renderOrder = 999
    swordGroup.add(crossguard)

    // Blade (flat, diamond color — the iconic MC look)
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.5, 0.025), handMat(0x33c9dc))
    blade.position.set(0, 0.36, 0)
    blade.renderOrder = 999
    swordGroup.add(blade)

    // Blade edge highlight (slightly lighter strip)
    const edge = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.5, 0.026), handMat(0x7fecf5))
    edge.position.set(0.035, 0.36, 0)
    edge.renderOrder = 999
    swordGroup.add(edge)

    // Blade tip (pointed — narrower top)
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 0.025), handMat(0x5ee8f5))
    tip.position.set(0, 0.63, 0)
    tip.renderOrder = 999
    swordGroup.add(tip)

    group.add(swordGroup)
    return group
  }

  // Scene configs — parkour maps (camera high, platforms below)
  const SCENES = {
    grassland: {
      sky: 0x6db3f0,
      fog: 0x9ed4ff,
      fogNear: 50, fogFar: 100,
      camY: 8, lookDown: 0.35, speed: 0.12,
      headBob: 0.06, headBobFreq: 6,
      terrain(x, z) {
        // Colorful parkour platforms — wide, with gaps
        const section = Math.floor(z / 6)
        const inSection = z % 6

        // Each section: 3-4 blocks platform, 2-3 blocks gap
        const platLen = 3 + Math.floor(pseudoRandom(section, 0) * 2)
        if (inSection >= platLen) return -99 // gap

        // Platform width varies, slightly offset left/right
        const offset = Math.floor(pseudoRandom(section, 10) * 5) - 2
        const width = 2 + Math.floor(pseudoRandom(section, 2) * 3)
        if (x < offset - width || x > offset + width) return -99

        // Height: gentle variation (all below camera)
        return Math.floor(pseudoRandom(section, 1) * 4) - 1
      },
      colors(x, z, y, maxY) {
        const section = Math.floor(z / 6)
        const palette = [0x4caf50, 0x2196f3, 0xff9800, 0xe91e63, 0x9c27b0,
                         0x00bcd4, 0xffeb3b, 0x8bc34a, 0xff5722, 0x3f51b5]
        const base = palette[Math.abs(section) % palette.length]
        if (y === maxY) return base
        const c = new THREE.Color(base)
        c.multiplyScalar(0.55)
        return c.getHex()
      }
    },
    cave: {
      sky: 0x0a0505,
      fog: 0x080202,
      fogNear: 25, fogFar: 60,
      camY: 7, lookDown: 0.32, speed: 0.11,
      headBob: 0.04, headBobFreq: 5,
      terrain(x, z) {
        // Nether parkour — narrow bridges over void, lava floor
        const section = Math.floor(z / 5)
        const inSection = z % 5

        // Lava floor always present (y = -4)
        const pathX = Math.abs(x)

        // Bridges: 2-3 blocks wide, 3-4 blocks long
        const platLen = 3 + Math.floor(pseudoRandom(section, 4) * 2)
        if (inSection >= platLen) {
          // Gap — but lava floor still exists
          return pathX <= 8 ? -4 : -99
        }

        const offset = Math.floor(pseudoRandom(section, 10) * 4) - 2
        const bwidth = 1 + Math.floor(pseudoRandom(section, 5) * 2)

        if (x >= offset - bwidth && x <= offset + bwidth) {
          // Bridge platform
          return Math.floor(pseudoRandom(section, 3) * 3)
        }
        // Lava floor
        return pathX <= 8 ? -4 : -99
      },
      colors(x, z, y, maxY) {
        // Lava floor
        if (y <= -3) {
          const flicker = pseudoRandom(x * 13 + Math.floor(cameraTime * 2), z * 7)
          return flicker > 0.5 ? 0xff6d00 : [0xff3d00, 0xdd2c00, 0xff8f00][Math.abs((x + z) % 3)]
        }
        if (y === maxY) {
          // Nether blocks
          if (pseudoRandom(x * 7, z * 3) > 0.85) return 0xffab00 // Gold ore
          return [0x4e342e, 0x5d4037, 0x6d4c41, 0x3e2723][Math.abs((x * 3 + z) % 4)]
        }
        return [0x3e2723, 0x321911, 0x2a1508][Math.abs((x + z) % 3)]
      }
    },
    sky: {
      sky: 0xb3e5fc,
      fog: 0xe1f5fe,
      fogNear: 55, fogFar: 110,
      camY: 10, lookDown: 0.38, speed: 0.11,
      headBob: 0.08, headBobFreq: 4,
      terrain(x, z) {
        // Floating islands with big gaps — dreamy
        const section = Math.floor(z / 8)
        const inSection = z % 8

        // Islands: 4-5 blocks, big gap 3-4
        const islandLen = 4 + Math.floor(pseudoRandom(section, 8) * 2)
        if (inSection >= islandLen) return -99

        // Round-ish shape
        const cx = Math.floor(pseudoRandom(section, 11) * 4) - 2
        const radius = 2 + Math.floor(pseudoRandom(section, 12) * 3)
        const dist = Math.abs(x - cx)
        if (dist > radius) return -99

        // Dome shape: higher in center, lower at edges
        const h = Math.floor((1 - dist / radius) * 3) + Math.floor(pseudoRandom(section, 9) * 3) - 1
        return h
      },
      colors(x, z, y, maxY) {
        const section = Math.floor(z / 8)
        if (y === maxY) {
          // Pastel tops
          const pastels = [0xffffff, 0xf8bbd0, 0xc5cae9, 0xb2dfdb, 0xdcedc8, 0xfff9c4, 0xf0f4c3]
          return pastels[Math.abs(section * 3 + x) % pastels.length]
        }
        if (y >= maxY - 1) return [0x90caf9, 0x81d4fa, 0x80cbc4][Math.abs((x + z) % 3)]
        return [0xb0bec5, 0x90a4ae, 0xcfd8dc][Math.abs((x + z) % 3)]
      }
    },
    ocean: {
      sky: 0x01579b,
      fog: 0x0277bd,
      fogNear: 30, fogFar: 70,
      camY: 8, lookDown: 0.3, speed: 0.10,
      headBob: 0.12, headBobFreq: 2.5,
      terrain(x, z) {
        // Underwater — coral towers rising from sea floor
        const pathX = Math.abs(x)
        if (pathX > 8) return -99

        // Sea floor always at -3
        const section = Math.floor(z / 4)
        const inSection = z % 4

        // Coral pillars: random columns rising up
        const hasCoral = pseudoRandom(Math.floor(x / 2) + section * 100, section) > 0.55
        if (hasCoral && inSection < 2 + Math.floor(pseudoRandom(section, 6) * 2)) {
          const coralH = Math.floor(pseudoRandom(x + section * 50, section * 3) * 5)
          if (Math.abs(x) % 3 < 2) return coralH
        }

        // Sand floor
        return -3
      },
      colors(x, z, y, maxY) {
        // Sand floor
        if (y <= -2) return [0xffcc80, 0xffe0b2, 0xffb74d][Math.abs((x + z) % 3)]
        if (y === maxY) {
          // Vibrant coral tops
          const corals = [0xff8a80, 0xf4ff81, 0x84ffff, 0xb388ff, 0xffab40, 0xa7ffeb, 0xea80fc, 0xff80ab]
          return corals[Math.abs((x * 3 + z * 7) % corals.length)]
        }
        if (y >= maxY - 1) return [0x00897b, 0x00796b, 0x00695c][Math.abs((x + z) % 3)]
        return [0x006064, 0x004d40, 0x00363a][Math.abs((x + z) % 3)]
      }
    }
  }

  function getSceneId() {
    return sceneSelect.value || 'grassland'
  }

  function init3DScene() {
    const cfg = SCENES[getSceneId()]

    scene3d = new THREE.Scene()
    scene3d.background = new THREE.Color(cfg.sky)
    scene3d.fog = new THREE.Fog(cfg.fog, cfg.fogNear, cfg.fogFar)

    camera3d = new THREE.PerspectiveCamera(75, bg3d.clientWidth / bg3d.clientHeight, 0.1, 150)
    camera3d.position.set(0, cfg.camY, 0)

    renderer3d = new THREE.WebGLRenderer({ canvas: bg3d, antialias: false })
    renderer3d.setSize(bg3d.clientWidth, bg3d.clientHeight)
    renderer3d.setPixelRatio(Math.min(window.devicePixelRatio, 1.5))

    // Lighting
    const ambient = new THREE.AmbientLight(0xffffff, getSceneId() === 'cave' ? 0.25 : 0.55)
    scene3d.add(ambient)
    const sun = new THREE.DirectionalLight(0xffffff, 0.9)
    sun.position.set(3, 10, -5)
    scene3d.add(sun)

    if (getSceneId() === 'cave') {
      const lava = new THREE.PointLight(0xff4400, 2.0, 20)
      lava.position.set(0, 0, -8)
      scene3d.add(lava)
    }
    if (getSceneId() === 'ocean') {
      const caustic = new THREE.PointLight(0x00e5ff, 1.2, 30)
      caustic.position.set(0, 5, -12)
      scene3d.add(caustic)
    }

    // First person hand with sword
    handGroup = createHand()
    handGroup.position.set(0.55, -0.45, -0.6)
    camera3d.add(handGroup)
    scene3d.add(camera3d)

    cameraZ = 0
    cameraTime = 0
    terrainChunks = []
    generateTerrain()
  }

  function generateTerrain() {
    const cfg = SCENES[getSceneId()]
    const camChunk = Math.floor(-cameraZ / CHUNK_SIZE)

    terrainChunks = terrainChunks.filter(c => {
      if (Math.abs(c.chunkZ - camChunk) > VIEW_DIST + 1) {
        scene3d.remove(c.mesh)
        c.mesh.geometry.dispose()
        c.mesh.material.dispose()
        return false
      }
      return true
    })

    for (let cz = camChunk - 1; cz <= camChunk + VIEW_DIST; cz++) {
      if (terrainChunks.some(c => c.chunkZ === cz)) continue
      const chunk = createChunk(cz, cfg)
      terrainChunks.push(chunk)
      scene3d.add(chunk.mesh)
    }
  }

  function createChunk(chunkZ, cfg) {
    const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE)
    const matrices = []
    const colors = []
    const tempMatrix = new THREE.Matrix4()

    for (let x = -9; x <= 9; x++) {
      for (let z = 0; z < CHUNK_SIZE; z++) {
