        const worldZ = chunkZ * CHUNK_SIZE + z
        const height = cfg.terrain(x, worldZ)
        if (height <= -90) continue

        const maxY = height
        const depth = getSceneId() === 'cave' ? 5 : 3

        for (let y = maxY - depth; y <= maxY; y++) {
          tempMatrix.makeTranslation(x * BLOCK_SIZE, y * BLOCK_SIZE, -worldZ * BLOCK_SIZE)
          matrices.push(tempMatrix.clone())
          const col = cfg.colors(x, worldZ, y, maxY)
          colors.push(new THREE.Color(typeof col === 'number' ? col : col))
        }
      }
    }

    if (matrices.length === 0) {
      const material = new THREE.MeshLambertMaterial()
      const mesh = new THREE.InstancedMesh(geometry, material, 1)
      tempMatrix.makeTranslation(0, -100, 0)
      mesh.setMatrixAt(0, tempMatrix)
      mesh.instanceMatrix.needsUpdate = true
      return { chunkZ, mesh }
    }

    const material = new THREE.MeshLambertMaterial()
    const mesh = new THREE.InstancedMesh(geometry, material, matrices.length)

    for (let i = 0; i < matrices.length; i++) {
      mesh.setMatrixAt(i, matrices[i])
      mesh.setColorAt(i, colors[i])
    }
    mesh.instanceMatrix.needsUpdate = true
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true

    return { chunkZ, mesh }
  }

  let lastRender3D = 0

  function animate3D() {
    if (!renderer3d) return
    raf3d = requestAnimationFrame(animate3D)

    const now = performance.now()
    const dt = lastRender3D ? Math.min((now - lastRender3D) / 1000, 0.05) : 0.016
    lastRender3D = now

    const cfg = SCENES[getSceneId()]
    cameraTime += dt

    // Forward movement — scale by delta time so speed is constant regardless of fps
    cameraZ -= cfg.speed * dt * 160

    // Head bob (sprint rhythm)
    const bobPhase = cameraTime * cfg.headBobFreq
    const bobY = Math.abs(Math.sin(bobPhase)) * cfg.headBob
    const bobX = Math.sin(bobPhase * 0.5) * 0.04

    // Camera tilt on landing
    const tiltZ = Math.sin(bobPhase) * 0.015

    camera3d.position.set(bobX, cfg.camY + bobY, cameraZ)
    camera3d.rotation.set(0, 0, 0)
    // Look down at the platforms + slight forward tilt
    camera3d.rotateX(-cfg.lookDown + Math.sin(cameraTime * 0.4) * 0.015)
    camera3d.rotateZ(tiltZ)

    // Hand sway (follows head bob with delay)
    if (handGroup) {
      handGroup.rotation.x = -0.1 + Math.sin(bobPhase + 0.5) * 0.06
      handGroup.rotation.z = 0.05 + Math.sin(bobPhase * 0.5) * 0.03
      handGroup.position.y = -0.45 + Math.sin(bobPhase) * 0.03
    }

    // Generate terrain
    const camChunk = Math.floor(-cameraZ / CHUNK_SIZE)
    const furthest = terrainChunks.reduce((max, c) => Math.max(max, c.chunkZ), 0)
    if (furthest < camChunk + VIEW_DIST) {
      generateTerrain()
    }

    renderer3d.render(scene3d, camera3d)
  }

  function start3DScene() {
    if (bg3d.clientWidth === 0 || bg3d.clientHeight === 0) return
    if (raf3d) {
      renderer3d.setSize(bg3d.clientWidth, bg3d.clientHeight)
      camera3d.aspect = bg3d.clientWidth / bg3d.clientHeight
      camera3d.updateProjectionMatrix()
      return
    }
    if (!scene3d) {
      init3DScene()
    }
    animate3D()
  }

  function stop3DScene() {
    if (raf3d) {
      cancelAnimationFrame(raf3d)
      raf3d = null

        c.mesh.material.dispose()
      })
      terrainChunks = []
      if (handGroup) { camera3d.remove(handGroup); handGroup = null }
      renderer3d.dispose()
      scene3d = null
      camera3d = null
      renderer3d = null

    if (!topic || !topic.id) return
    const data = await apiPost('/api/topics/' + topic.id + '/storyboards', { url, name })

  async function removeStoryboard(index) {
    const topic = topics[currentIndex]
    if (!topic || !topic.id) return
    const sb = getStoryboards()
    const item = sb[index]
    if (!item) return
    if (activeStoryboard === index) hideStoryboard()
    const data = await apiDelete('/api/topics/' + topic.id + '/storyboards/' + item.id)
    if (data.storyboards) {
      topics[currentIndex] = { ...topic, storyboards: data.storyboards }
    } else {
      // Fallback: remove locally
      topics[currentIndex] = { ...topic, storyboards: sb.filter((_, i) => i !== index) }

    renderStoryboards()

  function showStoryboard(index) {

    activeStoryboard = index

    // Remove existing img (keep sbNav)
    const oldImg = storyboardOverlay.querySelector('img')

  // Overlay: click zones — left 30% = prev, right 30% = next, center = close; img = drag
  storyboardOverlay.addEventListener('mousedown', (e) => {
    const img = storyboardOverlay.querySelector('img')

    // Click on nav dot — handled by sbNav listener
    if (e.target.closest('.sb-nav')) return

    // Click on image — start drag
    if (img && e.target === img) {
      sbOverlayDragging = true
      sbOverlayMoved = false
      sbOverlayStart = { x: e.clientX, y: e.clientY }
      // Switch to absolute positioning for drag
      const rect = img.getBoundingClientRect()
      const overlayRect = storyboardOverlay.getBoundingClientRect()
      img.style.position = 'absolute'
      img.style.left = ((rect.left + rect.width / 2 - overlayRect.left) / overlayRect.width * 100) + '%'
      img.style.top = ((rect.top + rect.height / 2 - overlayRect.top) / overlayRect.height * 100) + '%'
      img.style.transform = 'translate(-50%, -50%)'
      img.style.cursor = 'grabbing'
      e.preventDefault()
      return
    }

    // Click on background — zone navigation
    const rect = storyboardOverlay.getBoundingClientRect()
    const relX = (e.clientX - rect.left) / rect.width
    const sb = getStoryboards()
    if (relX < 0.3 && activeStoryboard > 0) {
      showStoryboard(activeStoryboard - 1)
    } else if (relX > 0.7 && activeStoryboard < sb.length - 1) {
      showStoryboard(activeStoryboard + 1)
    } else {
      hideStoryboard()
    }
  })

    if (!sbOverlayDragging) return
    const dx = e.clientX - sbOverlayStart.x
    const dy = e.clientY - sbOverlayStart.y
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) sbOverlayMoved = true
    const img = storyboardOverlay.querySelector('img')
    if (!img) return
    const rect = previewPane.getBoundingClientRect()
    const px = (e.clientX - rect.left) / rect.width * 100
    const py = (e.clientY - rect.top) / rect.height * 100
    img.style.left = px + '%'
    img.style.top = py + '%'
  })

  window.addEventListener('mouseup', () => {
    if (!sbOverlayDragging) return
    sbOverlayDragging = false

  async function downloadVideoFromUrl(url) {
    let swalInstance = null
    try {
      swalInstance = Swal.fire({
        title: '下載影片中…',
        html: '正在送出請求',
        allowOutsideClick: false,
        allowEscapeKey: false,
        showConfirmButton: false,
        ...swalDark,
        didOpen: () => Swal.showLoading(),
      })

      const result = await apiPost('/api/transcribe', { url })
      const videoId = result.video_id || result.id
      if (!videoId) throw new Error('未取得 video_id')

      // Poll for download completion
      const pollResult = await pollVideoStatus(videoId, (status) => {
        Swal.update({ html: '狀態：' + status })
      })

      Swal.close()

      const videoUrl = 'https://reelscript.isnowfriend.com/videos/' + pollResult.filename
      bgVideo.src = videoUrl
      bgVideo.volume = parseFloat(vcVolume.value)
      bgVideo.load()
      videoControls.style.display = 'inline-flex'
      vcPlay.textContent = '▶'
      vcTime.textContent = '0:00'
      refreshEditorPreview()

      appAlert('影片已載入', '完成', 'success')
    } catch (err) {
      Swal.close()
      appAlert(err.message || '下載失敗', '錯誤', 'error')
    }
  }

  async function pollVideoStatus(videoId, onStatus) {
    const maxAttempts = 90 // 3 minutes max (90 * 2s)
    for (let i = 0; i < maxAttempts; i++) {
      if (i > 0) await new Promise(resolve => setTimeout(resolve, 2000))
      const data = await apiGet('/api/transcribe/' + videoId)
      const status = data.status || 'unknown'
      if (onStatus) onStatus(status)
      if (status !== 'downloading' && status !== 'pending' && status !== 'processing' && data.filename) {
        return data
      }
      if (status === 'error' || status === 'failed') {
        throw new Error('影片處理失敗')
      }
    }
    throw new Error('下載逾時，請稍後再試')
  }

    if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')
    return m + ':' + String(s).padStart(2, '0')

    const item = sb[idx]
    const img = document.createElement('img')
    img.src = item.url || item.dataUrl || ''
    img.alt = '分鏡 ' + (idx + 1)

    // Navigation dots
    const nav = document.createElement('div')
    nav.className = 'ep-nav'
    sb.forEach((_, i) => {
      const dot = document.createElement('span')
      dot.className = 'ep-dot' + (i === idx ? ' active' : '')
      dot.addEventListener('click', (e) => { e.stopPropagation(); selectEpSlide(i) })
      nav.appendChild(dot)
    })

    // Arrow buttons
    const leftBtn = document.createElement('button')
    leftBtn.className = 'ep-arrow left'
    leftBtn.textContent = '\u2039'
    leftBtn.style.display = idx > 0 ? '' : 'none'
    leftBtn.addEventListener('click', (e) => { e.stopPropagation(); selectEpSlide(idx - 1) })

    const rightBtn = document.createElement('button')
    rightBtn.className = 'ep-arrow right'
    rightBtn.textContent = '\u203A'
    rightBtn.style.display = idx < sb.length - 1 ? '' : 'none'
    rightBtn.addEventListener('click', (e) => { e.stopPropagation(); selectEpSlide(idx + 1) })

    epSlidePreview.innerHTML = ''
    epSlidePreview.appendChild(img)
    epSlidePreview.appendChild(leftBtn)
    epSlidePreview.appendChild(rightBtn)
    epSlidePreview.appendChild(nav)
    epSlidePreview.classList.add('visible')

    // Click large image → open fullscreen overlay (only during recording)
    img.style.cursor = 'default'
    img.addEventListener('click', () => {
      if (isRecording) showStoryboard(idx)
    })

    // Scroll wheel zoom on preview image
    let epZoom = 1
    epSlidePreview.addEventListener('wheel', (e) => {
      e.preventDefault()
      epZoom = Math.min(5, Math.max(1, epZoom + (e.deltaY < 0 ? 0.2 : -0.2)))
      img.style.transform = epZoom === 1 ? '' : `scale(${epZoom})`
      img.style.cursor = epZoom > 1 ? 'grab' : 'pointer'
    }, { passive: false })

    // Pan when zoomed
    let epPanning = false, epPanX = 0, epPanY = 0, epStartX, epStartY
    img.addEventListener('mousedown', (e) => {
      if (epZoom <= 1) return
      e.preventDefault()
      epPanning = true
      epStartX = e.clientX - epPanX
      epStartY = e.clientY - epPanY
      img.style.cursor = 'grabbing'
    })
    window.addEventListener('mousemove', (e) => {
      if (!epPanning) return
      epPanX = e.clientX - epStartX
      epPanY = e.clientY - epStartY
      img.style.transform = `scale(${epZoom}) translate(${epPanX / epZoom}px, ${epPanY / epZoom}px)`
    })
    window.addEventListener('mouseup', () => {
      if (!epPanning) return
      epPanning = false
      img.style.cursor = epZoom > 1 ? 'grab' : 'pointer'
    })

    // Label
    epSlideLabel.textContent = (idx + 1) + ' / ' + sb.length
    epSlideLabel.style.display = ''

    // Update thumbnail active state
    epStoryboard.querySelectorAll('img').forEach((thumb, i) => {
      thumb.classList.toggle('active', i === idx)
    })
  }

  // --- Whiteboard (Drawing + Images) ---

  let wbMode = 'none' // 'none' | 'pen' | 'eraser'
  let wbDrawing = false
  let wbPenColor = '#ff4757'
  let wbPenSize = 4
  let wbImages = [] // { el, x, y }

  function resizeWbCanvas() {
    const rect = previewPane.getBoundingClientRect()
    wbCanvas.width = rect.width * window.devicePixelRatio
    wbCanvas.height = rect.height * window.devicePixelRatio
    wbCanvas.style.width = rect.width + 'px'
    wbCanvas.style.height = rect.height + 'px'
    wbCtx.scale(window.devicePixelRatio, window.devicePixelRatio)
    // Redraw saved strokes
    redrawStrokes()
  }

  // Store strokes for redraw after resize
  let wbStrokes = [] // [{ color, size, eraser, points: [{x,y}] }]
  let currentStroke = null

  function redrawStrokes() {
    wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height)
    const rect = previewPane.getBoundingClientRect()
    for (const s of wbStrokes) {
      if (s.points.length < 2) continue
      wbCtx.beginPath()
      wbCtx.strokeStyle = s.eraser ? '#000000' : s.color
      wbCtx.lineWidth = s.eraser ? 20 : s.size
      wbCtx.lineCap = 'round'
      wbCtx.lineJoin = 'round'
      wbCtx.globalCompositeOperation = s.eraser ? 'destination-out' : 'source-over'
      wbCtx.moveTo(s.points[0].x * rect.width, s.points[0].y * rect.height)
      for (let i = 1; i < s.points.length; i++) {
        wbCtx.lineTo(s.points[i].x * rect.width, s.points[i].y * rect.height)
      }
      wbCtx.stroke()
    }
    wbCtx.globalCompositeOperation = 'source-over'
  }

  function setWbMode(mode) {
    wbMode = wbMode === mode ? 'none' : mode
    wbLayer.classList.toggle('active', wbMode !== 'none')
    dtPen.classList.toggle('active', wbMode === 'pen')
    dtEraser.classList.toggle('active', wbMode === 'eraser')
    edPen.classList.toggle('active', wbMode === 'pen')
  }

  function getWbPos(e) {
    const rect = previewPane.getBoundingClientRect()
    const x = (e.clientX - rect.left) / rect.width
    const y = (e.clientY - rect.top) / rect.height
    return { x, y, px: e.clientX - rect.left, py: e.clientY - rect.top }
  }

  wbLayer.addEventListener('mousedown', (e) => {
    if (wbMode === 'none') return
    wbDrawing = true
    const pos = getWbPos(e)
    currentStroke = {
      color: wbPenColor,
      size: wbPenSize,
      eraser: wbMode === 'eraser',
      points: [{ x: pos.x, y: pos.y }]
    }
    wbCtx.beginPath()
    wbCtx.strokeStyle = wbMode === 'eraser' ? '#000' : wbPenColor
    wbCtx.lineWidth = wbMode === 'eraser' ? 20 : wbPenSize
    wbCtx.lineCap = 'round'
    wbCtx.lineJoin = 'round'
    wbCtx.globalCompositeOperation = wbMode === 'eraser' ? 'destination-out' : 'source-over'
    wbCtx.moveTo(pos.px, pos.py)
  })

  wbLayer.addEventListener('mousemove', (e) => {
    if (!wbDrawing) return
    const pos = getWbPos(e)
    currentStroke.points.push({ x: pos.x, y: pos.y })
    wbCtx.lineTo(pos.px, pos.py)
    wbCtx.stroke()
    wbCtx.beginPath()
    wbCtx.moveTo(pos.px, pos.py)
  })

  window.addEventListener('mouseup', () => {
    if (!wbDrawing) return
    wbDrawing = false
    wbCtx.globalCompositeOperation = 'source-over'
    if (currentStroke && currentStroke.points.length > 1) {
      wbStrokes.push(currentStroke)
    }
    currentStroke = null
  })

  // Image drag logic
  let dragImg = null
  let dragOffset = { x: 0, y: 0 }

  function addWbImage(src) {
    const img = document.createElement('img')
    img.className = 'wb-img'
    img.src = src
    img.style.left = '10%'
    img.style.top = '10%'
    previewPane.appendChild(img)

    img.addEventListener('mousedown', (e) => {
      if (wbMode !== 'none') return
      e.preventDefault()
      dragImg = img
      dragImg.classList.add('dragging')
      const rect = img.getBoundingClientRect()
      dragOffset.x = e.clientX - rect.left
      dragOffset.y = e.clientY - rect.top
    })

    img.addEventListener('dblclick', () => {
      img.remove()
      wbImages = wbImages.filter(i => i !== img)
    })

    wbImages.push(img)
  }

  window.addEventListener('mousemove', (e) => {
    if (!dragImg) return
    const pRect = previewPane.getBoundingClientRect()
    const x = e.clientX - pRect.left - dragOffset.x
    const y = e.clientY - pRect.top - dragOffset.y
    dragImg.style.left = (x / pRect.width * 100) + '%'
    dragImg.style.top = (y / pRect.height * 100) + '%'
  })

  window.addEventListener('mouseup', () => {
    if (dragImg) {
      dragImg.classList.remove('dragging')
      dragImg = null

  })

  async function startSubtitleFlow(modal, blob, blobUrl, filename) {
    var VID_CAPTIONS_URL = 'http://localhost:3005'
    var content = modal.querySelector('.sub-modal-content')
    content.innerHTML =
      '<div class="sub-progress">' +
        '<div class="sub-spinner"></div>' +
        '<div>正在傳送到字幕編輯器...</div>' +
      '</div>'

    // Listen for postMessage result from vid-captions
    function onSubtitleResult(e) {
      if (e.origin !== VID_CAPTIONS_URL) return
      if (!e.data || e.data.type !== 'vid-captions-result') return
      window.removeEventListener('message', onSubtitleResult)

      var videoResultUrl = e.data.videoUrl || ''
      var resultFilename = e.data.filename || 'subtitled_video.mp4'

      // Build full URL if relative
      var fullUrl = videoResultUrl.startsWith('http')
        ? videoResultUrl
        : VID_CAPTIONS_URL + videoResultUrl

      // Use DOM APIs instead of innerHTML to prevent XSS
      content.textContent = ''
      var wrapper = document.createElement('div')
      wrapper.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0'

      var title = document.createElement('div')
      title.style.cssText = 'font-size:1.3em;color:var(--accent);font-weight:600'
      title.textContent = '字幕版影片已完成'
      wrapper.appendChild(title)

      var video = document.createElement('video')
      video.src = fullUrl
      video.controls = true
      video.style.cssText = 'width:100%;max-height:300px;border-radius:8px;background:#000'
      wrapper.appendChild(video)

      var link = document.createElement('a')
      link.href = fullUrl
      link.download = resultFilename
      link.textContent = '下載字幕版影片'
      link.style.cssText = 'display:inline-flex;align-items:center;gap:6px;padding:8px 20px;background:var(--accent);color:#fff;border-radius:6px;text-decoration:none;font-weight:500'
      wrapper.appendChild(link)

      content.appendChild(wrapper)
    }
    window.addEventListener('message', onSubtitleResult)

    try {
      // Upload video to vid-captions server
      var formData = new FormData()
      formData.append('video', blob, filename)
      var uploadRes = await fetch(VID_CAPTIONS_URL + '/api/upload-video', {
        method: 'POST',
        body: formData,
      })
      var uploadData = await uploadRes.json()

      if (!uploadData.success) {
        window.removeEventListener('message', onSubtitleResult)
        content.innerHTML = '<div class="sub-progress" style="color:#e55">上傳失敗: ' + (uploadData.error || '未知錯誤') + '</div>'
        return
      }

      // Open vid-captions editor with the video + origin params
      var videoPath = '/temp/' + uploadData.videoPath
      var editorUrl = VID_CAPTIONS_URL + '/editor?import=' + encodeURIComponent(videoPath) +
        '&name=' + encodeURIComponent(filename) +
        '&source=reelmaker&origin=' + encodeURIComponent(location.origin)
      window.open(editorUrl, '_blank')

      content.innerHTML =
        '<div class="sub-progress" style="color:var(--accent)">' +
          '<div style="font-size:1.5em;margin-bottom:8px">&#10003;</div>' +
          '<div>已在新分頁開啟字幕編輯器</div>' +
          '<div style="font-size:0.85em;opacity:0.7;margin-top:4px">完成編輯後可直接送回此頁面</div>' +
        '</div>'

    } catch (err) {
      window.removeEventListener('message', onSubtitleResult)
      content.innerHTML =
        '<div class="sub-progress" style="color:#e55">' +
          '連線字幕編輯器失敗<br>' +
          '<span style="font-size:0.85em;opacity:0.7">請確認 vid-captions 正在運行 (port 3005)</span>' +
        '</div>'
    }
  }

  function pollTranscription(transcribeId, contentEl) {
    return new Promise(function(resolve) {
      var attempts = 0
      var maxAttempts = 300 // 10 min max
      var timer = setInterval(async function() {
        attempts++
        try {
          var result = await apiGet('/api/transcribe/' + transcribeId)
          if (result.status === 'ready' && result.segments) {
            clearInterval(timer)
            resolve(result.segments)
          } else if (result.status === 'error') {
            clearInterval(timer)
            contentEl.innerHTML = '<div class="sub-progress" style="color:#e55">轉錄失敗: ' + (result.error || '未知錯誤') + '</div>'
            resolve(null)
          } else {
            var dots = '.'.repeat((attempts % 3) + 1)
            var msgEl = contentEl.querySelector('.sub-progress div:last-child')
            if (msgEl) msgEl.textContent = '正在轉錄字幕' + dots
          }
        } catch (err) {
          // network error, keep polling
        }
        if (attempts >= maxAttempts) {
          clearInterval(timer)
          contentEl.innerHTML = '<div class="sub-progress" style="color:#e55">轉錄逾時，請重試</div>'
          resolve(null)
        }
      }, 2000)
    })
  }

    // Render segment list
    function renderSegments() {
      segmentsContainer.innerHTML = ''

        var row = document.createElement('div')
        row.className = 'sub-segment'
        row.dataset.idx = idx

        var timeSpan = document.createElement('span')
        timeSpan.className = 'sub-segment-time'
        timeSpan.textContent = fmtSubTime(seg.start) + ' - ' + fmtSubTime(seg.end)

        var textInput = document.createElement('textarea')
        textInput.className = 'sub-segment-text'
        textInput.value = seg.text
        textInput.rows = 1
        textInput.addEventListener('input', function(e) {
          // Immutable update
          segments = segments.map(function(s, i) {
            return i === idx ? Object.assign({}, s, { text: e.target.value }) : s
          })
        })
        textInput.addEventListener('click', function(e) {
          e.stopPropagation()
        })

        var delBtn = document.createElement('button')
        delBtn.className = 'sub-segment-del'
        delBtn.textContent = '\u00d7'
        delBtn.title = '刪除此段'
        delBtn.addEventListener('click', function(e) {
          e.stopPropagation()
          segments = segments.filter(function(_, i) { return i !== idx })
          renderSegments()
        })

        row.appendChild(timeSpan)
        row.appendChild(textInput)
        row.appendChild(delBtn)

        row.addEventListener('click', function() {
          video.currentTime = seg.start
          video.play()
        })

        segmentsContainer.appendChild(row)
      })
    }

    renderSegments()

    // Canvas overlay for subtitle preview
    function resizeOverlay() {
      if (!video.videoWidth) return
      var rect = video.getBoundingClientRect()
      overlayCanvas.width = rect.width
      overlayCanvas.height = rect.height
      overlayCanvas.style.width = rect.width + 'px'
      overlayCanvas.style.height = rect.height + 'px'
    }

    video.addEventListener('loadedmetadata', resizeOverlay)
    window.addEventListener('resize', resizeOverlay)

    function drawSubtitleOverlay() {
      if (!overlayCanvas.width) resizeOverlay()
      var ctx = overlayCanvas.getContext('2d')
      ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height)

      var currentSeg = findCurrentSegment(video.currentTime, segments)
      if (currentSeg && currentSeg.text.trim()) {
        var scaleX = overlayCanvas.width / (video.videoWidth || 1)
        var scaledFontSize = Math.round(subStyle.fontSize * scaleX)
        if (scaledFontSize < 12) scaledFontSize = 12

        ctx.font = 'bold ' + scaledFontSize + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
        ctx.textAlign = 'center'

        var text = currentSeg.text
        var maxWidth = overlayCanvas.width * 0.88
        var lines = wrapSubtitleText(ctx, text, maxWidth)
        var lineHeight = scaledFontSize * 1.35
        var totalHeight = lines.length * lineHeight
        var x = overlayCanvas.width / 2
        var y = subStyle.position === 'top'
          ? scaledFontSize + 16
          : overlayCanvas.height - totalHeight - 16

        // Draw background
        if (subStyle.bgEnabled) {
          var bgPadH = 10
          var bgPadV = 6
          lines.forEach(function(line, li) {
            var tw = ctx.measureText(line).width
            var ly = y + li * lineHeight
            ctx.fillStyle = 'rgba(0,0,0,0.6)'
            roundRect(ctx, x - tw / 2 - bgPadH, ly - scaledFontSize + 2 - bgPadV, tw + bgPadH * 2, scaledFontSize + bgPadV * 2, 6)
          })
        }

        // Draw text
        ctx.fillStyle = subStyle.color
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'
        ctx.lineWidth = 2
        lines.forEach(function(line, li) {
          var ly = y + li * lineHeight
          ctx.strokeText(line, x, ly)
          ctx.fillText(line, x, ly)
        })
      }

      // Highlight active segment in list
      var segRows = segmentsContainer.querySelectorAll('.sub-segment')
      segRows.forEach(function(row) {
        var idx = parseInt(row.dataset.idx, 10)
        var seg = segments[idx]
        if (seg && video.currentTime >= seg.start && video.currentTime <= seg.end) {
          row.classList.add('active')
        } else {
          row.classList.remove('active')
        }
      })

      requestAnimationFrame(drawSubtitleOverlay)
    }

    drawSubtitleOverlay()

    // Cancel
    actionsBar.querySelector('.sub-btn-cancel').addEventListener('click', function() {
      URL.revokeObjectURL(blobUrl)
      modal.remove()
    })

    // Export with subtitles
    actionsBar.querySelector('.sub-btn-export').addEventListener('click', function() {
      exportWithSubtitles(modal, blobUrl, filename, segments, subStyle)
    })
  }

  function findCurrentSegment(time, segments) {
    for (var i = 0; i < segments.length; i++) {
      if (time >= segments[i].start && time <= segments[i].end) {
        return segments[i]
      }
    }
    return null
  }

  function wrapSubtitleText(ctx, text, maxWidth) {
    var words = text.split('')
    var lines = []
    var currentLine = ''

    for (var i = 0; i < words.length; i++) {
      var testLine = currentLine + words[i]
      if (ctx.measureText(testLine).width > maxWidth && currentLine.length > 0) {
        lines.push(currentLine)
        currentLine = words[i]
      } else {
        currentLine = testLine
      }
    }
    if (currentLine) lines.push(currentLine)
    return lines.length > 0 ? lines : ['']
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath()
    ctx.moveTo(x + r, y)
    ctx.lineTo(x + w - r, y)
    ctx.quadraticCurveTo(x + w, y, x + w, y + r)
    ctx.lineTo(x + w, y + h - r)
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h)
    ctx.lineTo(x + r, y + h)
    ctx.quadraticCurveTo(x, y + h, x, y + h - r)
    ctx.lineTo(x, y + r)
    ctx.quadraticCurveTo(x, y, x + r, y)
    ctx.closePath()
    ctx.fill()
  }

  function exportWithSubtitles(modal, blobUrl, filename, segments, subStyle) {
    var body = modal.querySelector('.sub-modal-body')
    var content = modal.querySelector('.sub-modal-content')
    var actionsBar = modal.querySelector('.sub-actions')

    // Disable export button
    var exportBtn = actionsBar.querySelector('.sub-btn-export')
    exportBtn.disabled = true
    exportBtn.textContent = '輸出中...'

    // Add progress indicator
    var progressEl = document.createElement('div')
    progressEl.className = 'sub-export-progress'
    progressEl.textContent = '準備輸出...'
    actionsBar.insertBefore(progressEl, exportBtn)

    // Create offscreen video
    var srcVideo = document.createElement('video')
    srcVideo.src = blobUrl
    srcVideo.muted = true

    srcVideo.addEventListener('loadedmetadata', function() {
      var vw = srcVideo.videoWidth || 1080
      var vh = srcVideo.videoHeight || 1920
      var renderCanvas = document.createElement('canvas')
      renderCanvas.width = vw
      renderCanvas.height = vh
      var ctx = renderCanvas.getContext('2d')

      var stream = renderCanvas.captureStream(30)
      // Also capture audio from original
      var audioCtx = new AudioContext()
      var audioSrc = audioCtx.createMediaElementSource(srcVideo)
      var audioDest = audioCtx.createMediaStreamDestination()
      audioSrc.connect(audioDest)
      audioSrc.connect(audioCtx.destination) // keep local playback for sync

      // Combine video + audio tracks
      var combinedStream = new MediaStream()
      stream.getVideoTracks().forEach(function(t) { combinedStream.addTrack(t) })
      audioDest.stream.getAudioTracks().forEach(function(t) { combinedStream.addTrack(t) })

      var recorder = new MediaRecorder(combinedStream, {
        mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
          ? 'video/webm;codecs=vp9,opus'
          : 'video/webm'
      })

      var exportChunks = []
      recorder.ondataavailable = function(e) {
        if (e.data.size > 0) exportChunks.push(e.data)
      }

      recorder.onstop = function() {
        audioCtx.close()
        var exportBlob = new Blob(exportChunks, { type: 'video/webm' })
        var exportUrl = URL.createObjectURL(exportBlob)
        var a = document.createElement('a')
        var subtitledName = filename.replace('.webm', '_subtitled.webm')
        a.href = exportUrl
        a.download = subtitledName
        a.click()
        setTimeout(function() { URL.revokeObjectURL(exportUrl) }, 2000)

        progressEl.textContent = '輸出完成！'
        exportBtn.textContent = '輸出帶字幕影片'
        exportBtn.disabled = false
      }

      var duration = srcVideo.duration
      recorder.start(200)
      srcVideo.currentTime = 0
      srcVideo.play()

      function renderFrame() {
        if (srcVideo.ended || srcVideo.paused) {
          recorder.stop()
          return
        }

        // Update progress
        var pct = Math.round((srcVideo.currentTime / duration) * 100)
        progressEl.textContent = '輸出中... ' + pct + '%'

        // Draw video frame
        ctx.drawImage(srcVideo, 0, 0, vw, vh)

        // Find and draw subtitle
        var currentSeg = findCurrentSegment(srcVideo.currentTime, segments)
        if (currentSeg && currentSeg.text.trim()) {
          var fontSize = subStyle.fontSize
          // Scale font relative to video height (base assumes 1920 height)
          var scaledFont = Math.round(fontSize * (vh / 1920) * 2.5)
          if (scaledFont < 16) scaledFont = 16

          ctx.font = 'bold ' + scaledFont + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
          ctx.textAlign = 'center'

          var text = currentSeg.text
          var maxWidth = vw * 0.88
          var lines = wrapSubtitleText(ctx, text, maxWidth)
          var lineHeight = scaledFont * 1.35
          var totalHeight = lines.length * lineHeight
          var x = vw / 2
          var y = subStyle.position === 'top'
            ? scaledFont + 40
            : vh - totalHeight - 40

          if (subStyle.bgEnabled) {
            var bgPadH = 20
            var bgPadV = 12
            lines.forEach(function(line, li) {
              var tw = ctx.measureText(line).width
              var ly = y + li * lineHeight
              ctx.fillStyle = 'rgba(0,0,0,0.6)'
              roundRect(ctx, x - tw / 2 - bgPadH, ly - scaledFont + 4 - bgPadV, tw + bgPadH * 2, scaledFont + bgPadV * 2, 8)
            })
          }

          ctx.fillStyle = subStyle.color
          ctx.strokeStyle = 'rgba(0,0,0,0.5)'
          ctx.lineWidth = 3
          lines.forEach(function(line, li) {
            var ly = y + li * lineHeight
            ctx.strokeText(line, x, ly)
            ctx.fillText(line, x, ly)
          })
        }

        requestAnimationFrame(renderFrame)
      }

      renderFrame()
    })

    srcVideo.addEventListener('error', function() {
      progressEl.textContent = '輸出失敗'
      exportBtn.textContent = '輸出帶字幕影片'
      exportBtn.disabled = false
    })
  }

  // --- Init (async) ---

  async function init() {
    // Load settings from server
    try {
      const { settings } = await apiGet('/api/settings')
      if (settings) {
        // Apply mm_theme
        if (settings.mm_theme && MM_THEMES[settings.mm_theme]) {
          currentMmTheme = settings.mm_theme
          mmThemeSelect.value = currentMmTheme
          applyMmTheme(false)
        }
        // Apply split ratio
        if (settings.split !== undefined) {
          applySplit(parseInt(settings.split, 10) || 50)
        }
        // Apply prompter
        if (settings.prompter_text !== undefined) {
          prompterText.value = settings.prompter_text
        }
        if (settings.prompter_fontsize !== undefined) {
          prompterFontSize = parseInt(settings.prompter_fontsize, 10) || 16
          prompterText.style.fontSize = prompterFontSize + 'px'
        }
      }
    } catch (err) {
      console.error('Failed to load settings:', err)
    }

    // Load topics from server
    await loadTopics()

    // localStorage migration detection
    try {
      const oldTopics = localStorage.getItem('reelmaker_topics')
      if (oldTopics) {
        const parsed = JSON.parse(oldTopics)
        if (Array.isArray(parsed) && parsed.length > 0) {
          // Server has default seed topics only — offer migration
          const serverIsDefault = topics.length <= 3 && topics.every(t =>
            ['AI 發展趨勢', '簡報 Demo（切到簡報模式看）', '網路賺錢'].includes(t.name)
          )
          if (serverIsDefault && (await appConfirm('偵測到瀏覽器中有舊的主題資料（' + parsed.length + ' 個主題），要匯入到伺服器嗎？', '匯入舊資料'))) {
            const migratePayload = {
              topics: parsed,
              settings: {},
            }
            const oldTheme = localStorage.getItem('reelmaker_mm_theme')
            if (oldTheme) migratePayload.settings.mm_theme = oldTheme
            const oldSplit = localStorage.getItem('reelmaker_split')
            if (oldSplit) migratePayload.settings.split = oldSplit
            const oldPrompter = localStorage.getItem('reelmaker_prompter_text')
            if (oldPrompter) migratePayload.settings.prompter_text = oldPrompter
            const oldFontSize = localStorage.getItem('reelmaker_prompter_fontsize')
            if (oldFontSize) migratePayload.settings.prompter_fontsize = oldFontSize

            await apiPost('/api/migrate', migratePayload)

            // Reload from server
            await loadTopics()

            // Reload settings
            try {
              const { settings } = await apiGet('/api/settings')
              if (settings) {
                if (settings.mm_theme && MM_THEMES[settings.mm_theme]) {
                  currentMmTheme = settings.mm_theme
                  mmThemeSelect.value = currentMmTheme
                  applyMmTheme(false)
                }
                if (settings.split !== undefined) applySplit(parseInt(settings.split, 10) || 50)
                if (settings.prompter_text !== undefined) prompterText.value = settings.prompter_text
                if (settings.prompter_fontsize !== undefined) {
                  prompterFontSize = parseInt(settings.prompter_fontsize, 10) || 16
                  prompterText.style.fontSize = prompterFontSize + 'px'
                }
              }
            } catch { /* ok */ }

            // Clear old localStorage
            localStorage.removeItem('reelmaker_topics')
            localStorage.removeItem('reelmaker_mm_theme')
            localStorage.removeItem('reelmaker_split')
            localStorage.removeItem('reelmaker_prompter_text')
            localStorage.removeItem('reelmaker_prompter_fontsize')
          }
        }
      }
    } catch { /* migration detection failed, continue */ }

    renderTopicSelect()
    switchTopic(currentIndex)
    updateBgVisibility()
    setTimeout(resizeWbCanvas, 200)
  }

  init()

})()
</script>
